  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#e7eef7;font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;}
  body{display:flex;align-items:center;justify-content:center;overflow:hidden;}
  #wrap{position:relative;}
  #stage{position:relative;width:1920px;height:1080px;overflow:hidden;transform-origin:top left;
    background:var(--dd-paper);}

  /* ===== 底图层 ===== */
  #paper{position:absolute;inset:-60px;background:var(--dd-bg) center/cover no-repeat;opacity:0;will-change:transform;}
  #wash{position:absolute;inset:0;pointer-events:none;opacity:0;
    background:radial-gradient(ellipse 46% 40% at 26% 34%, rgba(255,255,255,.62), transparent 66%),
               radial-gradient(ellipse 40% 36% at 78% 72%, rgba(190,222,255,.5), transparent 68%);}
  #vign{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 82% 74% at 50% 48%, transparent 58%, rgba(196,212,234,.6) 100%);}
  #scan{position:absolute;top:-8%;height:116%;width:190px;left:-300px;opacity:0;transform:skewX(-6deg);
    pointer-events:none;
    background:linear-gradient(96deg, transparent, rgba(150,206,255,.22) 55%, rgba(205,235,255,.5) 92%, rgba(255,255,255,.95) 100%);}

  /* ===== 内容层 ===== */
  #content{position:absolute;inset:0;}

  /* Part 印章（绕自身中心甩拍 ⇒ origin 必须 50% 50%，SVG 外框用 stage 圆心同步转） */
  #stamp{position:absolute;left:150px;top:178px;opacity:0;transform-origin:50% 50%;}
  /* ⚠️ 固定宽度上限 + pre-wrap：Part 要吃「空格 + 回车分行」（R148/R150 同源坑）。
     max-content 让它按最宽那行长，buildStamp() 再据实测宽高画外框。 */
  #partTxt{display:block;white-space:pre-wrap;width:max-content;max-width:560px;
    font-size:35px;font-weight:900;letter-spacing:5px;color:var(--dd-blue);line-height:1.28;}
  #stampTag{position:absolute;left:4px;top:-48px;font-size:16px;font-weight:700;letter-spacing:6px;
    color:var(--dd-guide);opacity:0;white-space:pre;}

  /* 主标题 */
  #titleBox{position:absolute;left:150px;top:372px;width:1000px;}
  /* pre（不是 pre-wrap）：空格照出但不自动换行，断行由 buildTitle 按词边界自己管，
     算出的 lines.length 直接决定下划线/副标题位置（隐式换行会让两者错位） */
  .tline{display:block;white-space:pre;position:relative;}
  .tc{position:relative;display:inline-block;white-space:pre;color:transparent;opacity:0;}
  /* ⚠️ -webkit-text-stroke 是【继承】属性：不显式清零，#titleBox 上写的描边会漏进
     绝对定位的子层 .tf，落墨中途叠出「双倍粗」的字 */
  .tf{position:absolute;left:0;top:0;white-space:pre;color:var(--dd-ink);opacity:0;
    -webkit-text-stroke-width:0;transform-origin:50% 62%;pointer-events:none;}

  /* ===== 副标题 + 标注线 ===== */
  #subBox{position:absolute;left:150px;top:0;width:820px;opacity:0;}
  /* max-content（不是 820 死宽）：标注线要按【文字实际宽度】撑开，否则短线永远量到 820。
     父盒 #subBox 宽度写死 820 ⇒ shrink-to-fit 有确定参照，不会随容器瞬时宽度重排（R150）。 */
  #subTxt{display:block;white-space:pre-wrap;width:max-content;max-width:820px;
    font-size:26px;font-weight:800;
    letter-spacing:8px;color:color-mix(in srgb,var(--dd-ink) 62%,var(--dd-blue));line-height:1.4;}

  /* ===== 制图层（线稿 + 笔） ===== */
  #doodle{position:absolute;inset:0;pointer-events:none;z-index:5;}
  #doodle path,#doodle line,#doodle circle,#doodle rect,#doodle ellipse{fill:none;stroke-linecap:round;stroke-linejoin:round;}
  /* ⚠️ 上面这条把 #doodle 里所有图元的 fill 一律清零（CSS 声明优先于呈现属性）。
     所以【要实色的元素必须用内联 style="fill:…" 写】，写 fill="…" 属性会被静默吃掉 ——
     实测踩坑：笔尖三角、圆心点、四角星、比例尺实色格全变空心。 */
  #pen{opacity:0;}

  /* ===== 独立预览小面板 ===== */
  #panel{position:fixed;left:14px;top:14px;z-index:50;display:flex;gap:8px;align-items:center;}
  #panel input{border:1px solid #c9d6ea;border-radius:8px;padding:7px 10px;font-size:13px;background:#fff;color:#16233f;outline:none;}
  #panel input:focus{border-color:#2f6bf0;}
  #panel button{border:1px solid #2f6bf0;background:#2f6bf0;color:#fff;border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;}
  body.embed #panel{display:none;}
</style>
</head>

    /* 持期 line-boil：每 3 帧重落笔 0.7px，「活着的静止」 */
    var boil=f>200?Math.floor(f/3):0, bo=f>200?clamp(seg(f,200,208)):0;
    var jx=(hash1(boil*17+b)-0.5)*1.4*bo, jy=(hash1(boil*29+b*7)-0.5)*1.4*bo;
    brks[b].setAttribute('transform','translate('+jx.toFixed(2)+' '+jy.toFixed(2)+')');
  }
  /* 边中点准星：淡入 + 慢旋 */
  for(var xm=0;xm<xmarks.length;xm++){
    var xi=env(f,20+xm*4,34+xm*4);
    xmarks[xm].style.opacity=xi*0.85;
    var cc=[[960,100],[960,980],[100,540],[1820,540]][xm];
    xmarks[xm].setAttribute('transform','rotate('+(xi*45+f*0.35)+' '+cc[0]+' '+cc[1]+')');
  }

  /* ③ 版面辅助虚线：左边距竖线先落，标题基线横线随后拉出 */
  var gv=smoother(seg(f,24,50)), gh=smoother(seg(f,30,58));
  els.gV.setAttribute('y2', lerp(140, 830, gv).toFixed(1));
  els.gV.style.opacity=gv>0?0.6:0;
  els.gH.setAttribute('x2', lerp(132, 1120, gh).toFixed(1));
  els.gH.style.opacity=gh>0?0.45:0;

  /* ④ Part 印章：外框描一圈 → 盖章甩拍（过冲+压扁）→ 墨晕炸开 → 文字逐字打出 */
  if(window.__stampBox){
    var sp=window.__stampPath, bl=window.__stampBloom, bx=window.__stampBox;
    var cxc=bx.x+bx.w/2, cyc=bx.y+bx.h/2;
    var dr=smoother(seg(f,30,52));
    sp.style.strokeDashoffset=String(1-dr);
    sp.style.opacity=dr>0?0.95:0;
    var pb=seg(f,52,64);                        /* 落印：过冲→压扁→回稳 */
    var sq=pb>0&&pb<0.5 ? 1-0.10*Math.sin(pb/0.5*Math.PI) : 1;
    var scl=lerp(1.22,1.0,easeOut(clamp(pb/0.4)))*(1+0.03*Math.sin(f*0.05));
    var rot=lerp(-11,-4,easeOut(clamp(pb/0.45)));
    var stO=clamp(seg(f,30,38));
    els.stamp.style.opacity=stO;
    els.stamp.style.transform='rotate('+rot.toFixed(2)+'deg) scale('+scl.toFixed(3)+','+(scl*sq).toFixed(3)+')';
    sp.setAttribute('transform','rotate('+rot.toFixed(2)+' '+cxc+' '+cyc+')');
    sp.style.opacity=(dr>0?0.95:0)*(1-0.15*clamp(pb/0.4));
    /* 墨晕：落印瞬间一圈浅蓝扩散淡出 */
    var bloom=seg(f,54,70);
    if(bloom>0&&bloom<1){
      bl.setAttribute('cx',cxc); bl.setAttribute('cy',cyc);
      bl.setAttribute('rx',(bx.w/2*(0.7+0.75*bloom)).toFixed(1));
      bl.setAttribute('ry',(bx.h/2*(0.8+0.9*bloom)).toFixed(1));
      bl.setAttribute('opacity',(Math.sin(bloom*Math.PI)*0.30).toFixed(3));
    } else bl.setAttribute('opacity','0');
    /* 外框抖动跟印章同步 */
    var stBoil=f>200?Math.floor(f/3):0, sbo=f>200?clamp(seg(f,200,208)):0;
    if(sbo>0){
      var j2=(hash1(stBoil*13)-0.5)*1.2*sbo, j3=(hash1(stBoil*41+5)-0.5)*1.2*sbo;
      sp.setAttribute('transform','rotate('+rot.toFixed(2)+' '+cxc+' '+cyc+') translate('+j2.toFixed(2)+' '+j3.toFixed(2)+')');
    }
    /* 上方小标签 */
    var tg=env(f,64,78);
    els.stampTag.style.opacity=tg*0.9;
    els.stampTag.style.transform='translateX('+((1-tg)*-12)+'px)';
  }

  /* ⑤ 主标题：笔尖扫过 ⇒ 先出空心描线，9 帧后落墨成实色（ink drying 拖尾） */
  var pos=(f-SCH.t0)/SCH.step;
  var penCol=cssVar('--dd-pen');
  for(var i=0;i<SCH.n;i++){
    var dt=f-(SCH.t0+i*SCH.step);
    if(dt<0){ charEls[i].style.opacity=0; fillEls[i].style.opacity=0; continue; }
    var oIn=clamp(dt/4);
    charEls[i].style.opacity=oIn;
    /* 静止后必须写 none：常驻 translate(0px) 会让每字挂独立合成层，栅格化不稳且拖慢导出 */
    charEls[i].style.transform=(oIn>=1)?'none':'translateY('+((1-easeOut(oIn))*10).toFixed(2)+'px)';
    var sw=2.6*(1-clamp((dt-9)/3));
    charEls[i].style.setProperty('-webkit-text-stroke-width', sw.toFixed(2)+'px');
    charEls[i].style.setProperty('-webkit-text-stroke-color', penCol);
    var q=clamp((dt-9)/3);
    fillEls[i].style.opacity=q;
    /* ⚠️ 落墨中途【不许加 blur，也不许放大过冲】：CJK 笔画细，半透明 + 模糊会把
       撇捺直接糊没（实测抽帧里「义」只剩一个灰块），只留粗笔画的残片 → 读成花屏。
       过冲压到 1.06、窗口 3 帧，中途态肉眼抓不到。 */
    fillEls[i].style.transform=(q>=1)?'none':'scale('+lerp(1.06,1.0,easeOut(q)).toFixed(3)+')';
    fillEls[i].style.filter='none';
  }

  /* ⑥ 制图笔：跟着当前字走 → 走到下划线起点 → 沿下划线描 → 提笔淡出 */
  var penX=0, penY=0, penO=0;
  if(f>=SCH.t0-6 && f<=SCH.ulEnd+10){
    penO=clamp(seg(f,SCH.t0-6,SCH.t0+2))*out(f,SCH.ulEnd-2,SCH.ulEnd+10);
    if(f<SCH.ul){
      var pf=pos-Math.floor(pos);
      var a=penPt[clamp(Math.floor(pos),0,SCH.n-1)]||penPt[0];
      var bnext=penPt[Math.min(SCH.n-1,Math.floor(pos)+1)]||a;
      var kk=easeInOut(clamp(pf));
      penX=lerp(a.x,bnext.x,kk); penY=lerp(a.y,bnext.y,kk);
      if(pos<0){ penX=lerp(1560,a.x,clamp(seg(f,SCH.t0-6,SCH.t0))); penY=lerp(150,a.y,clamp(seg(f,SCH.t0-6,SCH.t0))); }
    } else {
      var up=smoother(seg(f,SCH.ul,SCH.ulEnd));
      var P=els.uline.getTotalLength();
      var pt=els.uline.getPointAtLength(P*up);
      penX=pt.x; penY=pt.y+2;
    }
    var bob=Math.sin(f*0.42)*1.6;
    els.pen.style.opacity=penO;
    els.pen.setAttribute('transform','translate('+penX.toFixed(1)+' '+(penY+bob).toFixed(1)+') rotate('+(-4+Math.sin(f*0.2)*1.8).toFixed(2)+')');
  } else { els.pen.style.opacity=0; }

  /* ⑦ 手绘下划线：与笔尖同一条进度曲线 */
  var ul=smoother(seg(f,SCH.ul,SCH.ulEnd));
  els.uline.style.strokeDashoffset=String(1-ul);
  els.uline.style.opacity=ul>0?0.92:0;
  if(f>200){
    var ub=(hash1(Math.floor(f/3)*7+3)-0.5)*1.1*clamp(seg(f,200,208));
    els.uline.setAttribute('transform','translate(0 '+ub.toFixed(2)+')');
  } else els.uline.removeAttribute('transform');

  /* ⑧ 两条标注线：标题上方量「主标题宽」、副标题下方量「副标题宽」，
        再叠上副标题逐字打字 ⇒ 整版读成一张处处有尺寸的制图稿 */
  if(!window.__dim){
    window.__dim={ sub: makeDim('subDim'), top: makeDim('topDim') };
  }
  var s0=SCH.sub, sIn=smoother(seg(f,s0,s0+20));
  els.subBox.style.opacity=clamp(seg(f,s0+4,s0+18));
  paintDim(window.__dim.sub, LX+SUBW/2, SUBW/2*sIn, LINEY, sIn);
  window.__dim.sub.g.style.opacity = cfg.sub ? 1 : 0;
  var tp=smoother(seg(f,SCH.topDim,SCH.topDim+18));
  paintDim(window.__dim.top, LX+TITLEW/2, TITLEW/2*tp, TOPDY, tp);
  if(cfg.sub){
    /* 逐字打字：clip-path inset 从右往左揭，比 opacity 淡入更像「写出来」 */
    var tw=clamp(seg(f,SCH.subTxt,SCH.subTxt+Math.max(8,(cfg.sub||'').length*1.1)));
    els.subTxt.style.opacity=1;
    els.subTxt.style.clipPath='inset(0 '+((1-tw)*100).toFixed(2)+'% 0 0)';
    els.subTxt.style.transform='translateY('+((1-easeOut(clamp(seg(f,SCH.subTxt,SCH.subTxt+14))))*8).toFixed(2)+'px)';
  }

  /* ⑨ 右侧技术图：同心圆依次描出 + 剖面线 + 轨道点 + 引出标注 */
  /* 上传图在场时：镜内 c2/c3/圆心点/剖面线让位。只淡出、不「倒着擦回去」，
     否则两个圆在照片进场时往回缩，读成画歪了。 */
  var hasImg=!!cfg.img;
  var ip=hasImg?clamp(seg(f,150,166)):0, lensK=1-ip;
  var c1p=smoother(seg(f,120,152)), c2p=smoother(seg(f,130,160)), c3p=smoother(seg(f,140,168));
  setCirc(els.c1,216,c1p); setCirc(els.c2,150,c2p,lensK); setCirc(els.c3,86,c3p,lensK);
  els.cDot.style.opacity=(env(f,146,156)*lensK).toFixed(3);
  els.cDot.setAttribute('r',(16+2.4*Math.sin(f*0.06)).toFixed(2));
  var k1=smoother(seg(f,134,152));
  els.cross1.setAttribute('x1',1470-256*k1); els.cross1.setAttribute('x2',1470+256*k1);
  els.cross1.style.opacity=k1>0?0.75:0;
  var k2=smoother(seg(f,138,156));
  els.cross2.setAttribute('y1',560-256*k2); els.cross2.setAttribute('y2',560+256*k2);
  els.cross2.style.opacity=k2>0?0.75:0;
  for(var hz=0;hz<hzEls.length;hz++){
    var he=hzEls[hz], hp=smoother(seg(f,148+hz*2,168+hz*2));
    var HL=+he.getAttribute('data-len');
    he.style.strokeDasharray=HL.toFixed(1);
    he.style.strokeDashoffset=(HL*(1-hp)).toFixed(1);
    he.style.opacity=hp>0?(0.85*lensK).toFixed(3):0;
  }
  var orp=smoother(seg(f,152,178));
  setCirc(els.orbit,256,orp);
  els.orbit.setAttribute('transform','rotate('+((f*0.55)%360)+' 1470 560)');
  els.orbit.setAttribute('r',(256+Math.sin(f*0.028)*6).toFixed(1));
  els.sat.style.opacity=orp;
  els.sat.setAttribute('transform','rotate('+(((f*1.5)%360))+' 1470 560)');
  var lp=smoother(seg(f,162,182));
  els.lead.style.strokeDasharray='1'; els.lead.style.strokeDashoffset=String(1-lp);
  els.lead.style.opacity=lp>0?0.9:0;
  els.leadDot.style.opacity=lp>0?0.95:0;
  var lb=env(f,178,190);
  els.leadG.style.opacity=lb*0.9;
  els.leadG.setAttribute('transform',
    'translate(1743 301) scale('+lerp(0.8,1,easeOut(lb)).toFixed(3)+') translate(-1743 -301)');

  /* ⑨b 产品图贴片（有上传图才画）：外框描一圈 → 光圈自中心张开（clipPath 半径逐帧写）
        → 四角定位角弹入 → 底下量一条尺寸线。
     ⚠️ 无图时【一帧都不写】：这组是 12 个属性 + 一条尺寸线（含两个 path d），
        导出时每帧空写一遍 = 每帧多一次样式失效 + 合成层重排。连续第二轮导出实测
        从第 73 帧起帧帧 20s 抓帧超时（合成器悬挂），所以「不用就完全不碰」。 */
  if(hasImg){
    var pk=smoother(seg(f,152,176));
    var ir=easeInOut(clamp(seg(f,164,192)));
    els.prodG.style.opacity='1';
    els.prodFrame.style.strokeDasharray='1';
    els.prodFrame.style.strokeDashoffset=String(1-pk);
    els.prodFrame.style.opacity=pk>0?0.95:0;
    els.pclipC.setAttribute('r',(ir*236).toFixed(1));   /* 236 > 贴片半对角 212 ⇒ 全开时四角不缺 */
    els.prodMatte.style.opacity=(0.55*pk).toFixed(3);
    for(var pc=0;pc<pcrns.length;pc++){
      var cpp=smoother(seg(f,178+pc*3,192+pc*3));
      pcrns[pc].style.strokeDasharray='1';
      pcrns[pc].style.strokeDashoffset=String(1-cpp);
      pcrns[pc].style.opacity=cpp>0?0.9:0;
    }
    if(!window.__dimProd) window.__dimProd=makeDim('prodDim');
    var pdp=smoother(seg(f,188,206));
    paintDim(window.__dimProd,1470,150*pdp,744,pdp);
    window.__prodOff=false;
  } else if(!window.__prodOff && els.prodG.style.opacity!=='0'){
    els.prodG.style.opacity='0';   /* 只在「刚被还原成矢量」时收一次尾 */
    window.__prodOff=true;
  }

  /* ⑩ 底部比例尺：色块自左向右逐格「刷」出（绕自身左边缘 scaleX，不缩放描边） */
  for(var rt=0;rt<rtEls.length;rt++){
    var rp=smoother(seg(f,158+rt*2.4,172+rt*2.4));
    var rx0=+rtEls[rt].getAttribute('data-x');
    rtEls[rt].setAttribute('transform',
      'translate('+rx0+' 0) scale('+rp.toFixed(3)+' 1) translate('+(-rx0)+' 0)');
    rtEls[rt].style.opacity=rp>0?0.9:0;
  }

  /* ⑪ 指示箭头：从副标题区引向右侧技术图 */
  var ai=smoother(seg(f,176,194));
  els.arrow.style.strokeDasharray='1'; els.arrow.style.strokeDashoffset=String(1-ai);
  els.arrow.style.opacity=ai>0?0.9:0;
  var ah=smoother(seg(f,192,202));
  els.arrowHead.style.strokeDasharray='1'; els.arrowHead.style.strokeDashoffset=String(1-ah);
  els.arrowHead.style.opacity=ah;

  /* ⑫ 手绘点缀：星光 / 四角星 / 加号 / 斜框 错开弹入并持续呼吸 */
  for(var k1i=0;k1i<sparks.length;k1i++){
    var sIn2=env(f,160+k1i*8,172+k1i*8);
    sparks[k1i].style.opacity=sIn2*(0.5+0.5*Math.sin(f*0.085+k1i*2.1));
    var scx2=+sparks[k1i].getAttribute('data-cx'), scy2=+sparks[k1i].getAttribute('data-cy');
    var ssc=0.7+0.3*sIn2+0.13*Math.sin(f*0.07+k1i);
    sparks[k1i].setAttribute('transform','translate('+scx2+' '+scy2+') rotate('+((f*1.4+k1i*40)%360)+') scale('+ssc.toFixed(3)+') translate('+(-scx2)+' '+(-scy2)+')');
  }
  for(var k2i=0;k2i<spark4s.length;k2i++){
    var bb=f-(166+k2i*7), e3=bb<=0?0:spring(clamp(bb/16,0,1.35)/1.35);
    var ccx=[1191,300,1782][k2i], ccy=[499,643,881][k2i];
    spark4s[k2i].style.opacity=e3*0.95;
    var sc2=e3*(0.9+0.16*Math.sin(f*0.06+k2i*2.4));
    spark4s[k2i].setAttribute('transform','translate('+ccx+' '+ccy+') scale('+sc2.toFixed(3)+') rotate('+((f*0.5+k2i*24)%360)+') translate('+(-ccx)+' '+(-ccy)+')');
  }
  for(var k3i=0;k3i<pluses.length;k3i++){
    var pin=env(f,170+k3i*6,184+k3i*6);
    pluses[k3i].style.opacity=pin*0.85;
    var pcx=[262,1262,1721][k3i], pcy=[262,906,176][k3i];
    pluses[k3i].setAttribute('transform','rotate('+(pin*90+f*0.8)+' '+pcx+' '+pcy+')');
  }
  for(var k4i=0;k4i<tilts.length;k4i++){
    var tb=f-(174+k4i*6), e4=tb<=0?0:spring(clamp(tb/14,0,1.35)/1.35);
    var tx=[1066,608][k4i], ty=[642,212][k4i];
    tilts[k4i].style.opacity=e4*0.9;
    tilts[k4i].setAttribute('transform','rotate('+(45+e4*10+Math.sin(f*0.05+k4i)*6)+' '+tx+' '+ty+')');
  }

  /* ⑬ 扫描光带：f188-212 掠过一次（复印机/扫描仪过纸）。⚠️ 峰值压到 0.5：
        再亮就把标题整块洗成灰白，肉眼审片时读成「字没落墨」。 */
  var sc=seg(f,188,212);
  els.scan.style.opacity=(sc>0&&sc<1)?Math.sin(sc*Math.PI)*0.5:0;
  els.scan.style.left=lerp(-300,1980,sc)+'px';
}
function setCirc(el,r,p,om){
  var C=2*Math.PI*r;
  el.style.strokeDasharray=(p*C).toFixed(1)+' '+(C*2).toFixed(1);
  el.style.opacity=p>0?(0.95*(om===undefined?1:om)).toFixed(3):0;
}

/* ---------- 播放循环 ---------- */
var startAt=performance.now(), rafId=0;
function tick(now){
  var t=((now-startAt)/1000)%CYCLE;
  render(Math.min(DUR, t*FPS));
  rafId=requestAnimationFrame(tick);
}
function restart(){ startAt=performance.now(); }
function fit(){
  /* ⚠️ 无放大上限（导出高清链路要求） */
  var s=Math.min(innerWidth/1920, innerHeight/1080);
  var st=document.getElementById('stage'), wr=document.getElementById('wrap');
  st.style.transform='scale('+s+')';
  wr.style.width=(1920*s)+'px'; wr.style.height=(1080*s)+'px';
}
window.addEventListener('resize',fit);

/* ---------- 配色 ---------- */
var VAR_NAMES=['--dd-paper','--dd-pen','--dd-blue','--dd-sky','--dd-ink','--dd-guide'];
function applyColors(vars){
  var root=document.documentElement.style, k;
  for(k in vars){ if(k.indexOf('--dd-')===0) root.setProperty(k,vars[k]); }
  _varCache={};
}

/* ---------- 自定义字体（cyber 协议） ---------- */
function applyFont(d){
  var name=d.family, url=d.dataURL;
  if(!name){ var old=document.getElementById('__ddFont'); if(old) old.remove(); return; }
  var st=document.getElementById('__ddFont')||document.createElement('style');
  st.id='__ddFont';
  st.textContent = url ? '@font-face{font-family:"__ddfont";src:url('+url+') format("truetype");font-display:block;}' : '';
  if(!st.parentNode) document.head.appendChild(st);
  var fam = url ? '__ddfont' : name;
  document.getElementById('stage').style.fontFamily='"'+fam+'","Noto Sans SC","Microsoft YaHei",sans-serif';
}

/* ---------- postMessage 桥（与 grid-blue-open 同协议） ---------- */
window.addEventListener('message',function(e){
  var d=e.data||{};
  if(d.source!=='host')return;
  try{
    if(d.type==='cyber-embed'){ document.body.classList.add('embed'); fit(); }
    else if(d.type==='cyber-unembed'){ document.body.classList.remove('embed'); fit(); }
    else if(d.type==='cyber-cfg'){ applyCfg(d); if(d.replay)restart(); }
    else if(d.type==='cyber-color'){ applyColors(d.vars||{}); }
    else if(d.type==='cyber-img'){ setProdImg(d.img||''); }
    else if(d.type==='cyber-font'){ applyFont(d); }
    else if(d.type==='cyber-play'){ restart(); if(!rafId) rafId=requestAnimationFrame(tick); }
    else if(d.type==='cyber-seek'){
      if(rafId){ try{ cancelAnimationFrame(rafId); }catch(err){} rafId=0; }
      if(typeof d.t==='number'){ try{ render(Math.min(DUR, d.t*FPS)); void document.documentElement.offsetHeight; }catch(err){} }
    }
    else if(d.type==='cyber-resume'){
      startAt=performance.now(); if(!rafId) rafId=requestAnimationFrame(tick);
    }
    else if(d.type==='cyber-get-html'){
      var ovr='',k2;
      var cs=getComputedStyle(document.documentElement);
      for(k2=0;k2<VAR_NAMES.length;k2++){ ovr+=VAR_NAMES[k2]+':'+cs.getPropertyValue(VAR_NAMES[k2]).trim()+';'; }
      ovr=':root{'+ovr+'}';
      /* ⚠️ 本注释里不能写 script 闭合标签的字面量 —— 它会先把自己所在的 script 截断 */
      var boot='<script>window.__DD_BOOT='+JSON.stringify({part:cfg.part,title:cfg.title,sub:cfg.sub,img:cfg.img||''}).replace(/</g,'\\u003c')+'<\/script>';
      var html=PRISTINE.replace('</head>','<style id="dd-override">'+ovr+'</style>'+boot+'</head>');
      parent.postMessage({source:'cyber',type:'cyber-html',reqId:d.reqId,html:html},'*');
    }
  }catch(err){ parent.postMessage({source:'cyber',type:'cyber-status',err:err.message},'*'); }
});

/* ---------- 独立面板 ---------- */
$('pPart').addEventListener('input',function(){ applyCfg({part:this.value}); restart(); });
$('pTitle').addEventListener('input',function(){ applyCfg({title:this.value}); restart(); });
$('pSub').addEventListener('input',function(){ applyCfg({sub:this.value}); restart(); });
$('pPlay').addEventListener('click',function(){ restart(); });
$('pImg').addEventListener('change',function(){
  var f=this.files&&this.files[0]; if(!f) return;
  if(!/^image\//i.test(f.type||'')) return;
  var r=new FileReader();
  r.onload=function(){ setProdImg(r.result); restart(); };
  r.readAsDataURL(f); this.value='';
});

/* ---------- 启动 ---------- */
if(window.__DD_BOOT){ applyCfg(window.__DD_BOOT); }
applyCfg(cfg);
fit();
render(0);
rafId=requestAnimationFrame(tick);
parent.postMessage({source:'cyber',type:'cyber-ready'},'*');
/* 调试暴露 */
window.seek=function(sec){ startAt=performance.now()-sec*1000; };
window.play=restart;
window.__ddRender=render; window.__ddDUR=DUR; window.__ddApply=applyCfg;
</script>
