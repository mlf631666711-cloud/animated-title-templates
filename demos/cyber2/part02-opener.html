<script>
"use strict";
/* 捕获 pristine DOM(引擎任何 mutation 之前) —— 导出固化 HTML 用 */
var PRISTINE = '<!doctype html>\n' + document.documentElement.outerHTML;

/* ---------- 缓动 / 插值 ---------- */
var clamp=function(v,a,b){ a=a===undefined?0:a; b=b===undefined?1:b; return Math.max(a,Math.min(b,v)); };
function bezFn(x1,y1,x2,y2){
  var cx=3*x1, bx=3*(x2-x1)-cx, ax=1-cx-bx;
  var cy=3*y1, by=3*(y2-y1)-cy, ay=1-cy-by;
  function sX(t){return ((ax*t+bx)*t+cx)*t;}
  function sY(t){return ((ay*t+by)*t+cy)*t;}
  function dX(t){return (3*ax*t+2*bx)*t+cx;}
  return function(x){
    if(x<=0)return 0; if(x>=1)return 1;
    var t=x,i,e,d;
    for(i=0;i<8;i++){ e=sX(t)-x; if(Math.abs(e)<1e-5)break; d=dX(t); if(Math.abs(d)<1e-6)break; t-=e/d; }
    return sY(clamp(t,0,1));
  };
}
function interp(f,xs,ys,ease){
  if(f<=xs[0])return ys[0];
  var n=xs.length;
  if(f>=xs[n-1])return ys[n-1];
  for(var i=0;i<n-1;i++){ if(f>=xs[i]&&f<=xs[i+1]){ var t=(f-xs[i])/(xs[i+1]-xs[i]); if(ease)t=ease(t); return ys[i]+(ys[i+1]-ys[i])*t; } }
  return ys[n-1];
}
/* Remotion spring 闭式解(欠阻尼 0→1, 初速 0) */
function spring(frames,damping,stiffness,mass){
  if(frames<=0)return 0;
  var zeta=damping/(2*Math.sqrt(stiffness*mass));
  var w0=Math.sqrt(stiffness/mass);
  var t=frames/30;
  if(zeta>=1) return 1-Math.exp(-zeta*w0*t);
  var wd=w0*Math.sqrt(1-zeta*zeta);
  return 1-Math.exp(-zeta*w0*t)*(Math.cos(wd*t)+(zeta*w0/wd)*Math.sin(wd*t));
}
var E_OUT=bezFn(0.16,1,0.3,1);
var E_4021=bezFn(0.4,0,0.2,1);
var E_3021=bezFn(0.3,0,0.2,1);
var E_2213=bezFn(0.22,1,0.36,1);
var E_5070=bezFn(0.5,0,0.75,0);
var E_3413=bezFn(0.34,1.3,0.64,1);
var E_4501=bezFn(0.45,0,0.55,1);
var E_4025=bezFn(0.4,0,0.25,1);
var E_5021=bezFn(0.5,0,0.2,1);

/* ---------- 时间轴 / 几何 (源 theme.ts) ---------- */
var T={
  bgIn:[0,13], arcDraw:[2,20],
  cursorPop:[9,14], cursorToTL:[14,24],
  edgeTop:[24,32], edgeRight:[32,40], edgeBottom:[40,48], edgeLeft:[48,56],
  handleOut:[57,64], panelFill:[56,65], panelBorder:[57,67], panelGlow:[59,71],
  partBar:[44,63], partText:[53,69], decoLine:[51,67],
  title:[56,92], cursorFly:[80,100], chevrons:[81,103], stars:[83,107],
  idleFrom:101
};
var CORNER={TL:{x:424,y:425},TR:{x:1624,y:425},BR:{x:1624,y:875},BL:{x:424,y:875}};
var CURSOR_START={x:1010,y:640}, CURSOR_FINAL={x:1560,y:918};
var PANEL={w:1200,h:450}, PERIM=2*(PANEL.w+PANEL.h);
var DUR=165, HOLD=0.9, CYCLE=DUR/30+HOLD; // 6.4s

/* ---------- DOM ---------- */
function $(id){return document.getElementById(id);}
var els={
  backdrop:$('backdrop'),g1:$('bdGrid1'),g2:$('bdGrid2'),mist:$('bdMist'),side:$('bdSide'),
  arcMain:$('arcMain'),arcSub:$('arcSub'),arcFlow:$('arcFlow'),
  selSvg:$('selectSvg'),selLine:$('selLine'),
  handles:[$('hTL'),$('hTR'),$('hBR'),$('hBL')],
  marks:[$('cmTL'),$('cmTR'),$('cmBR'),$('cmBL')],
  panel:$('panel'),pBorder:$('panelBorder'),
  plBar:$('plBar'),plText:$('plText'),plSpan:$('plSpan'),plLine:$('plLine'),plDotA:$('plDotA'),plDotB:$('plDotB'),
  title:$('titleText'),
  chevs:[$('ch1'),$('ch2'),$('ch3'),$('ch4'),$('ch5')],
  stars:[$('st1'),$('st2'),$('st3')],
  curMain:$('curMain'),curMainPath:$('curMainPath'),
  trails:[$('curT0'),$('curT1'),$('curT2'),$('curT3')]
};
var MAINLEN=els.arcMain.getTotalLength();
var SUBLEN=els.arcSub.getTotalLength();
els.arcMain.style.strokeDasharray=MAINLEN+' '+MAINLEN;
els.arcSub.style.strokeDasharray=SUBLEN+' '+SUBLEN;
els.arcFlow.style.strokeDasharray='120 '+(MAINLEN+160);
els.selLine.style.strokeDasharray=PERIM+' '+PERIM;
var CHEV_X=[1668,1728,1788,474,512], CHEV_DELAY=[81,84,87,93,96], CHEV_SIZE=[52,52,52,30,30];
var STAR_DELAY=[83,89,94], STAR_PHASE=[0,2.1,4.2];

/* ---------- 光标位置纯函数 ---------- */
function seg(f,range,fx,fy,tx,ty,ease){
  var p=interp(f,range,[0,1],ease);
  return {x:fx+(tx-fx)*p, y:fy+(ty-fy)*p};
}
function cursorPos(f){
  if(f<T.cursorPop[0])return null;
  if(f<T.cursorToTL[1])return seg(f,T.cursorToTL,CURSOR_START.x,CURSOR_START.y,CORNER.TL.x,CORNER.TL.y,E_3021);
  if(f<T.edgeTop[1])return seg(f,T.edgeTop,CORNER.TL.x,CORNER.TL.y,CORNER.TR.x,CORNER.TR.y,E_4025);
  if(f<T.edgeRight[1])return seg(f,T.edgeRight,CORNER.TR.x,CORNER.TR.y,CORNER.BR.x,CORNER.BR.y,E_4025);
  if(f<T.edgeBottom[1])return seg(f,T.edgeBottom,CORNER.BR.x,CORNER.BR.y,CORNER.BL.x,CORNER.BL.y,E_4025);
  if(f<T.edgeLeft[1])return seg(f,T.edgeLeft,CORNER.BL.x,CORNER.BL.y,CORNER.TL.x,CORNER.TL.y,E_4025);
  if(f<T.cursorFly[0]){
    var drift=Math.sin((f-T.edgeLeft[1])*0.18)*5;
    return {x:CORNER.TL.x+4+drift, y:CORNER.TL.y+2+drift*0.5};
  }
  if(f<T.cursorFly[1])return seg(f,T.cursorFly,CORNER.TL.x+4,CORNER.TL.y+2,CURSOR_FINAL.x,CURSOR_FINAL.y,E_5021);
  var t=f-T.cursorFly[1];
  return {x:CURSOR_FINAL.x+Math.sin(t*0.07)*4, y:CURSOR_FINAL.y+Math.sin(t*0.05)*3};
}
function drawnLength(f){
  return interp(f,T.edgeTop,[0,PANEL.w])+interp(f,T.edgeRight,[0,PANEL.h])
       + interp(f,T.edgeBottom,[0,PANEL.w])+interp(f,T.edgeLeft,[0,PANEL.h]);
}
function posAt(f,delay){
  var x=f-delay, i=Math.floor(x);
  var a=cursorPos(i), b=cursorPos(i+1);
  if(!a||!b)return null;
  var fr=x-i;
  return {x:a.x+(b.x-a.x)*fr, y:a.y+(b.y-a.y)*fr};
}

/* ---------- 逐帧渲染 ---------- */
function render(f){
  /* Backdrop */
  var bgIn=interp(f,T.bgIn,[0,1],E_OUT);
  els.backdrop.style.opacity=bgIn;
  var gridIn=interp(f,[3,18],[0,1],E_OUT);
  els.g1.style.opacity=gridIn*0.85;
  els.g1.style.backgroundPosition=(-f*0.14)+'px '+(-f*0.1)+'px';
  els.g2.style.opacity=gridIn*0.55;
  els.g2.style.backgroundPosition=(31+f*0.08)+'px '+(47-f*0.06)+'px';
  els.mist.style.opacity=gridIn*0.8;
  els.side.style.opacity=0.9+0.1*Math.sin(f*0.045);

  /* Orbit arcs */
  els.arcMain.style.strokeDashoffset=interp(f,T.arcDraw,[MAINLEN,0],E_4021);
  els.arcSub.style.strokeDashoffset=interp(f,[6,24],[SUBLEN,0],E_4021);
  var flowStart=Math.max(0,f-T.idleFrom), cycle=MAINLEN+280;
  els.arcFlow.style.strokeDashoffset=MAINLEN-((flowStart*14)%cycle);
  els.arcFlow.style.opacity=interp(f,[T.idleFrom,T.idleFrom+12],[0,0.9]);

  /* Panel: 选区描线 */
  var selectOpacity=interp(f,[23,25,63,69],[0,1,1,0]);
  els.selSvg.style.opacity=selectOpacity;
  els.selLine.style.strokeDashoffset=PERIM-drawnLength(f);

  /* 角柄 */
  var out=interp(f,T.handleOut,[1,0],E_5070);
  var pops=[24,32,40,48];
  for(var i=0;i<4;i++){
    var s=spring(f-pops[i],12,220,0.6)*out;
    els.handles[i].style.transform='scale('+(s<=0.01?0:s)+')';
  }
  /* 角点缀 */
  var md=[58,60,62,64], rot=[0,90,180,270];
  for(i=0;i<4;i++){
    var mp=spring(f-md[i],12,200,0.5);
    els.marks[i].style.opacity=mp<0.01?0:1;
    els.marks[i].style.transform='translate(-11px,-11px) rotate('+rot[i]+'deg) scale('+mp+')';
  }
  /* 面板 */
  var fillIn=interp(f,T.panelFill,[0,1],E_3021);
  var borderIn=interp(f,T.panelBorder,[0,1],E_OUT);
  var settle=spring(f-T.panelFill[0],14,130,0.8);
  var glowBase=interp(f,T.panelGlow,[0,1],E_OUT);
  var idleGlow=f>T.idleFrom?1+0.1*Math.sin((f-T.idleFrom)*0.06):1;
  var glow=glowBase*idleGlow;
  els.panel.style.opacity=fillIn;
  els.panel.style.transform='scale('+(0.985+0.015*settle)+')';
  els.panel.style.filter='drop-shadow(0 0 '+(20*glow)+'px '+colorMix('--p2-blue',0.4*glow)+') drop-shadow(0 0 '+(54*glow)+'px '+colorMix('--p2-purple',0.42*glow)+')';
  els.pBorder.style.opacity=borderIn;

  /* Part 标签 */
  els.plBar.style.transform='skewX(-12deg) scaleX('+interp(f,T.partBar,[0,1],E_2213)+')';
  els.plText.style.opacity=interp(f,T.partText,[0,1],E_OUT);
  els.plText.style.transform='translateX('+interp(f,T.partText,[-36,0],E_OUT)+'px)';
  var lineH=interp(f,T.decoLine,[0,96],E_2213);
  els.plLine.style.height=lineH+'px';
  els.plLine.style.top=(367+(96-lineH))+'px';
  var dA=spring(f-59,12,240,0.5), dB=spring(f-64,12,240,0.5);
  els.plDotA.style.opacity=dA>0.01?1:0; els.plDotA.style.transform='scale('+dA+')';
  els.plDotB.style.opacity=dB>0.01?1:0; els.plDotB.style.transform='scale('+dB+')';

  /* 主标题 */
  if(f<T.title[0]){ els.title.style.opacity=0; }
  else{
    var rise=interp(f,[T.title[0],T.title[0]+26],[118,-3.5],E_OUT);
    var st=interp(f,[T.title[0]+26,T.title[1]],[-3.5,0],E_3413);
    var y=f>=T.title[0]+26?st:rise;
    els.title.style.transform='translateY('+y+'px)';
    els.title.style.opacity=interp(f,[T.title[0],T.title[0]+9],[0,1]);
    var tg=f>T.idleFrom?1+0.12*Math.sin((f-T.idleFrom)*0.055):1;
    els.title.style.textShadow='0 5px 16px rgba(0,0,0,0.6), 0 0 '+(30*tg)+'px '+colorMix('--p2-blue',0.3*tg)+', 0 0 '+(64*tg)+'px '+colorMix('--p2-purple',0.22*tg);
  }

  /* 箭头 */
  for(i=0;i<5;i++){
    var cp=spring(f-CHEV_DELAY[i],13,210,0.6);
    var cidle=f>T.idleFrom?0.86+0.14*Math.sin((f-T.idleFrom)*0.07+CHEV_X[i]):1;
    els.chevs[i].style.opacity=cp*cidle*(i>=3?0.85:1);
    els.chevs[i].style.transform='scale('+(0.4+0.6*cp)+')';
    els.chevs[i].style.filter='drop-shadow(0 0 7px '+(i>=3?'#B06BFF':cssVar('--p2-blue'))+')';
  }
  /* 星芒 */
  for(i=0;i<3;i++){
    var sp=spring(f-STAR_DELAY[i],11,190,0.55);
    var tw=f>T.idleFrom?0.72+0.28*Math.sin((f-T.idleFrom)*0.1+STAR_PHASE[i]):1;
    var br=f>T.idleFrom?1+0.07*Math.sin((f-T.idleFrom)*0.08+STAR_PHASE[i]):1;
    els.stars[i].style.opacity=sp*tw;
    els.stars[i].style.transform='scale('+(sp*br)+') rotate('+((1-sp)*-40)+'deg)';
    els.stars[i].style.filter='drop-shadow(0 0 8px color-mix(in srgb, var(--p2-blue) 90%, transparent)) drop-shadow(0 0 20px color-mix(in srgb, var(--p2-purple) 60%, transparent))';
  }

  /* 鼠标 */
  var pos=cursorPos(f);
  if(!pos){ els.curMain.style.opacity=0; }
  else{
    var pop=spring(f-T.cursorPop[0],11,200,0.55);
    var mix=interp(f,T.cursorFly,[0,1],E_4501);
    var col=mix<0.5?cssVar('--p2-cursor'):'#EAFBFF';
    var glowC=mix<0.5?colorMix('--p2-cursor',0.9):'rgba(0,198,255,0.95)';
    var prev=cursorPos(f-4);
    var speed=prev?Math.hypot(prev.x-pos.x,prev.y-pos.y):0;
    var speedIn=interp(speed,[18,42],[0,1]);
    els.curMain.style.opacity=pop;
    els.curMain.style.left=pos.x+'px'; els.curMain.style.top=pos.y+'px';
    els.curMain.style.transform='translate(-3px,-2px) scale('+pop+')';
    els.curMain.style.filter='drop-shadow(0 0 6px '+glowC+') drop-shadow(0 0 18px '+glowC+')';
    els.curMainPath.setAttribute('fill',col);
    var delays=[0.4,0.8,1.2,1.6];
    for(i=0;i<4;i++){
      var tp=posAt(f,delays[i]);
      if(!tp||speedIn<=0.01){ els.trails[i].style.opacity=0; continue; }
      var op=speedIn*0.3*(1-delays[i]/2), sc=(0.82-delays[i]*0.05)*pop;
      els.trails[i].style.opacity=op;
      els.trails[i].style.left=tp.x+'px'; els.trails[i].style.top=tp.y+'px';
      els.trails[i].style.transform='translate(-3px,-2px) scale('+sc+')';
      els.trails[i].style.filter='drop-shadow(0 0 6px '+glowC+')';
      els.trails[i].firstElementChild.setAttribute('fill',col);
    }
  }
}
/* 十六进制/任意 CSS 颜色 → rgba(var,N%) 用 color-mix */
function colorMix(v,alphaPct){
  return 'color-mix(in srgb, '+ (v.charAt(0)==='-'?('var('+v+')'):v) +' '+Math.round(alphaPct*100)+'%, transparent)';
}
var _varCache={};
function cssVar(name){
  if(!_varCache[name]) _varCache[name]=getComputedStyle(document.documentElement).getPropertyValue(name).trim()||'#fff';
  return _varCache[name];
}

/* ---------- 播放循环 ---------- */
var startAt=performance.now(), rafId=0;
function tick(now){
  var t=((now-startAt)/1000)%CYCLE;
  var f=Math.min(DUR, t*30);
  render(f);
  rafId=requestAnimationFrame(tick);
}
function restart(){ startAt=performance.now(); }
function fit(){
  /* ⚠️ 不要加放大上限（曾经是 ,1）：导出降级链路把画布撑到 1080P/4K 时要能铺满，否则四周黑边 */
  var s=Math.min(innerWidth/2048, innerHeight/1152);
  var st=document.getElementById('stage'), wr=document.getElementById('wrap');
  st.style.transform='scale('+s+')';
  wr.style.width=(2048*s)+'px'; wr.style.height=(1152*s)+'px';
}
window.addEventListener('resize',fit);

/* ---------- 配置 / 配色 ---------- */
var cfg={part:"Part.02",title:"如何编辑和导出"};
function applyCfg(c){
  if(c.part!=null){ cfg.part=c.part; els.plSpan.textContent=c.part; }
  if(c.title!=null){
    cfg.title=c.title;
    var t=els.title;
    /* 支持 \n 换行：每行一个 .line，字号按最长行自适应（\r 兼容 Windows CRLF） */
    var lines=String(c.title==null?'':c.title).replace(/\r/g,'').split('\n');
    t.innerHTML='';
    for(var li=0;li<lines.length;li++){
      var dv=document.createElement('div'); dv.className='line';
      dv.textContent=lines[li]===''?'\u00a0':lines[li];
      t.appendChild(dv);
    }
    t.style.fontSize='128px';
    var maxW=0;
    var lns=t.querySelectorAll('.line');
    for(var lj=0;lj<lns.length;lj++){ maxW=Math.max(maxW,lns[lj].scrollWidth); }
    /* 宽度自适应（1120 可用宽）+ 高度自适应（titleWrap 高 200，总行高不溢出被裁） */
    var fs=128;
    if(maxW>1120){ fs=Math.max(40,Math.floor(128*1120/maxW)); }
    var fsByH=Math.floor(200/(lines.length*1.15));
    if(fs>fsByH){ fs=Math.max(30,fsByH); }
    t.style.fontSize=fs+'px';
  }
}
function applyColors(vars){
  var root=document.documentElement.style, k;
  for(k in vars){ if(k.indexOf('--p2-')===0) root.setProperty(k,vars[k]); }
  _varCache={}; // 失效缓存
}

/* ---------- postMessage 桥 (与 cyber-chapter-card 同协议) ---------- */
window.addEventListener('message',function(e){
  var d=e.data||{};
  if(d.source!=='host')return;
  try{
    if(d.type==='cyber-embed'){ document.body.classList.add('embed'); fit(); }
    else if(d.type==='cyber-cfg'){ applyCfg(d); if(d.replay)restart(); }
    else if(d.type==='cyber-color'){ applyColors(d.vars||{}); }
    else if(d.type==='cyber-play'){ restart(); if(!rafId) rafId=requestAnimationFrame(tick); }
    else if(d.type==='cyber-seek'){
      /* 导出用：取消 rAF，由宿主逐帧驱动 render(帧号) */
      if(rafId){ try{ cancelAnimationFrame(rafId); }catch(e){} rafId=0; }
      if(typeof d.t==='number'){ try{ render(Math.min(DUR, d.t*30)); }catch(err){} }
    }
    else if(d.type==='cyber-resume'){
      startAt=performance.now(); if(!rafId) rafId=requestAnimationFrame(tick);
    }
    else if(d.type==='cyber-get-html'){
      var ovr='',k2;
      var cs=getComputedStyle(document.documentElement);
      for(k2 in (d.vars||{})){} /* noop 保兼容 */
      var varNames=['--p2-bg1','--p2-bg2','--p2-bg3','--p2-blue','--p2-purple','--p2-pink','--p2-cursor'];
      var host={}; (window.__P2_LASTVARS=window.__P2_LASTVARS||{});
      varNames.forEach(function(vn){ host[vn]=cs.getPropertyValue(vn).trim(); });
      ovr=':root{'+varNames.map(function(vn){return vn+':'+host[vn];}).join(';')+'}';
      var boot='<script>window.__P2_BOOT='+JSON.stringify({part:cfg.part,title:cfg.title})+'<\/script>';
      var html=PRISTINE.replace('</head>','<style id="p2-override">'+ovr+'</style>'+boot+'</head>');
      parent.postMessage({source:'cyber',type:'cyber-html',reqId:d.reqId,html:html},'*');
    }
  }catch(err){ parent.postMessage({source:'cyber',type:'cyber-status',err:err.message},'*'); }
});

/* ---------- 启动 ---------- */
if(window.__P2_BOOT){ applyCfg(window.__P2_BOOT); }
fit();
render(0);
rafId=requestAnimationFrame(tick);
parent.postMessage({source:'cyber',type:'cyber-ready'},'*');
/* 调试暴露 */
window.seek=function(sec){ startAt=performance.now()-sec*1000; };
window.play=restart;
</script>
</body>
