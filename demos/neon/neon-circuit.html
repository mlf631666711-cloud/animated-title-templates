<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>NeonCircuit Opener · 霓虹电路章节开场</title>
<!--
  霓虹电路 NEON CIRCUIT · 章节开场
  规格: 2048x1152 @30fps, 165帧(5.5s) + idle 常驻呼吸(0.9s) → CYCLE≈6.4s
  设计稿: research/neon-circuit/动效视觉脚本_霓虹电路.md
  引擎: 逐帧 render(f) + Remotion spring 闭式解 + CSS var 配色, postMessage 桥同 cyber2。
  配色变量: --nc-bg1/2/3 背景三段, --nc-cyan/--nc-green/--nc-pink/--nc-gold 四主色
-->
<style>
  :root{
    --nc-bg1:#050814; --nc-bg2:#0A1230; --nc-bg3:#160A2E;
    --nc-cyan:#00F5FF; --nc-green:#39FF88; --nc-pink:#FF3D81; --nc-gold:#FFC857;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#02040c;font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;}
  body{display:flex;align-items:center;justify-content:center;overflow:hidden;}
  body.embed{background:#02040c;}
  #wrap{position:relative;}
  #stage{position:relative;width:2048px;height:1152px;overflow:hidden;background:#02040c;transform-origin:top left;}

  /* ===== 1 背景 ===== */
  #backdrop{position:absolute;inset:0;opacity:0;}
  #bdBase{position:absolute;inset:0;background:linear-gradient(158deg,var(--nc-bg1) 0%,var(--nc-bg2) 48%,var(--nc-bg3) 100%);}
  #bdGlow{position:absolute;inset:0;background:radial-gradient(ellipse 58% 50% at 50% 54%, color-mix(in srgb, var(--nc-cyan) 22%, transparent), transparent 68%);}
  .bdgrid{position:absolute;inset:-120px;opacity:0;}
  #bdGrid1{background-image:linear-gradient(color-mix(in srgb,var(--nc-cyan) 10%, transparent) 1px, transparent 1px),
    linear-gradient(90deg, color-mix(in srgb,var(--nc-cyan) 10%, transparent) 1px, transparent 1px);background-size:74px 74px;}
  #bdGrid2{background-image:radial-gradient(circle, color-mix(in srgb,var(--nc-green) 12%, transparent) 1.8px, transparent 2.4px);background-size:96px 96px;}
  #bdSide{position:absolute;inset:0;background:
    radial-gradient(ellipse 30% 58% at 6% 46%, color-mix(in srgb,var(--nc-pink) 16%, transparent), transparent 66%),
    radial-gradient(ellipse 30% 58% at 94% 42%, color-mix(in srgb,var(--nc-gold) 13%, transparent), transparent 66%);}

  /* ===== 2+3 电路线路 ===== */
  #circuit{position:absolute;inset:0;width:100%;height:100%;}
  #trunk{stroke:var(--nc-cyan);}
  #trunkFlow{stroke:#fff;}
  .branch{fill:none;stroke-linecap:round;opacity:0;}
  .cap{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--nc-gold);transform:scale(0);
    box-shadow:0 0 12px color-mix(in srgb,var(--nc-gold) 95%, transparent);}
  .dot{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--nc-green);opacity:0;
    box-shadow:0 0 10px 3px color-mix(in srgb,var(--nc-green) 85%, transparent);}

  /* ===== 弹跳符号(霓虹雷达环充当球 —左抛入→ 展开成框) ===== */
  #ncBall{position:absolute;width:200px;height:200px;opacity:0;transform:translate(-50%,-50%);
    fill:var(--nc-cyan);
    filter:drop-shadow(0 0 14px color-mix(in srgb,var(--nc-cyan) 90%, transparent))
           drop-shadow(0 0 42px color-mix(in srgb,var(--nc-cyan) 55%, transparent));
    will-change:transform,left,top,opacity;}
  #ncRing{position:absolute;width:720px;height:720px;opacity:0;pointer-events:none;z-index:2;
    filter:drop-shadow(0 0 12px var(--nc-cyan));}

  /* ===== 5 晶体面板 ===== */
  #crystal{position:absolute;left:424px;top:352px;width:1200px;height:500px;opacity:0;}
  #crystalBorder{position:absolute;inset:0;opacity:0;filter:drop-shadow(0 0 14px color-mix(in srgb,var(--nc-pink) 55%, transparent));
    clip-path:polygon(36px 10px, calc(100% - 24px) 10px, calc(100% - 6px) 30px, calc(100% - 6px) 470px, calc(100% - 36px) 490px, 24px 490px, 6px 470px, 6px 30px);
    background:linear-gradient(128deg, var(--nc-pink) 0%, var(--nc-cyan) 55%, var(--nc-pink) 100%);}
  #crystalGlass{position:absolute;inset:5px;opacity:0;clip-path:polygon(33px 12px, calc(100% - 22px) 12px, calc(100% - 8px) 34px, calc(100% - 8px) 464px, calc(100% - 33px) 486px, 26px 486px, 8px 464px, 8px 34px);
    background:linear-gradient(180deg, color-mix(in srgb,var(--nc-cyan) 8%, transparent), transparent 34%), rgba(4,8,20,0.82);}
  #scanner{position:absolute;left:8px;right:8px;height:3px;top:30px;opacity:0;pointer-events:none;
    background:linear-gradient(90deg, transparent, var(--nc-green), transparent);
    filter:drop-shadow(0 0 8px var(--nc-green));}
  #crystalInner{position:absolute;inset:0;width:100%;height:100%;}

  /* ===== 6 章节标签 ===== */
  #ncTagBar{position:absolute;left:462px;top:432px;width:388px;height:92px;transform-origin:left center;transform:skewX(-14deg) scaleX(0);
    background:linear-gradient(115deg, var(--nc-pink) 0%, var(--nc-green) 60%, var(--nc-cyan) 100%);
    clip-path:polygon(14px 0, 100% 0, calc(100% - 22px) 100%, 0 100%);
    box-shadow:0 12px 40px rgba(0,0,0,.5), 0 0 44px color-mix(in srgb,var(--nc-green) 30%, transparent), inset 0 1px 0 rgba(255,255,255,.35);}
  #ncTagText{position:absolute;left:462px;top:432px;width:388px;height:92px;display:flex;align-items:center;justify-content:center;opacity:0;}
  #ncTagText span{font-weight:900;font-style:italic;font-size:52px;letter-spacing:.06em;color:#fff;
    text-shadow:0 3px 12px rgba(4,8,20,.6);transform:skewX(-6deg);white-space:nowrap;}
  #ncTagScan{position:absolute;left:466px;width:384px;height:2px;opacity:0;background:linear-gradient(90deg,transparent,#fff,transparent);
    filter:drop-shadow(0 0 6px #fff);}
  #ncTagCapA{position:absolute;width:13px;height:13px;border-radius:50%;background:var(--nc-gold);transform:scale(0);
    box-shadow:0 0 12px color-mix(in srgb,var(--nc-gold) 95%, transparent);}
  #ncTagCapB{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--nc-cyan);transform:scale(0);
    box-shadow:0 0 10px color-mix(in srgb,var(--nc-cyan) 95%, transparent);}

  /* ===== 7 主标题 ===== */
  #titleWrap{position:absolute;left:424px;top:560px;width:1200px;height:230px;overflow:hidden;display:flex;justify-content:center;align-items:center;}
  #titleText{margin:0;font-weight:900;font-size:126px;line-height:1.12;letter-spacing:.05em;color:#fff;display:flex;flex-direction:column;align-items:center;}
  #titleText .line{display:block;white-space:nowrap;}
  #titleText .ch{display:inline-block;opacity:0;}

  /* ===== 8 环境粒子 ===== */
  .spiral{position:absolute;opacity:0;}
  .zig{position:absolute;opacity:0;}
  .grain{position:absolute;opacity:0;}

  /* ===== 数据脉冲光点（复用 .dot） ===== */
</style>
</head>
<body>
<div id="wrap"><div id="stage">

  <div id="backdrop">
    <div id="bdBase"></div>
    <div id="bdGlow"></div>
    <div class="bdgrid" id="bdGrid1"></div>
    <div class="bdgrid" id="bdGrid2"></div>
    <div id="bdSide"></div>
  </div>

  <svg id="circuit" viewBox="0 0 2048 1152">
    <defs>
      <linearGradient id="trunkGrad" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="var(--nc-pink)"/>
        <stop offset="50%" stop-color="var(--nc-cyan)"/>
        <stop offset="100%" stop-color="var(--nc-green)"/>
      </linearGradient>
    </defs>
    <path id="trunk" d="M 110 60 L 430 60 L 470 100 L 470 330 L 510 330 L 510 100 L 550 60 L 1560 60 C 1720 60, 1800 160, 1800 320 L 1800 860 C 1800 980, 1720 1040, 1560 1040 L 190 1040" fill="none" stroke="url(#trunkGrad)" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    <path id="trunkFlow" d="M 110 60 L 430 60 L 470 100 L 470 330 L 510 330 L 510 100 L 550 60 L 1560 60 C 1720 60, 1800 160, 1800 320 L 1800 860 C 1800 980, 1720 1040, 1560 1040 L 190 1040" fill="none" stroke-width="7" stroke-linecap="round" opacity="0" style="filter:drop-shadow(0 0 8px rgba(255,255,255,.95))"/>
    <!-- 分支线路 -->
    <path class="branch" id="br1" d="M 720 330 L 720 200 L 850 70" fill="none" stroke="var(--nc-pink)" stroke-width="3.5"/>
    <path class="branch" id="br2" d="M 1030 330 L 1030 150" fill="none" stroke="var(--nc-pink)" stroke-width="3.5"/>

  </svg>

  <div class="cap" id="cap1" style="left:850px;top:64px;"></div>

  <svg id="ncBall" viewBox="0 0 200 200" aria-hidden="true" style="position:absolute;">
    <circle cx="100" cy="100" r="92" fill="none" stroke="var(--nc-cyan)" stroke-width="2.5" opacity="0.55"/>
    <circle cx="100" cy="100" r="64" fill="none" stroke="var(--nc-cyan)" stroke-width="7"/>
    <circle cx="100" cy="100" r="40" fill="none" stroke="var(--nc-green)" stroke-width="2" opacity="0.75"/>

  </svg>
  <div id="crystal">
    <div id="crystalBorder"></div>

    <svg id="crystalInner" viewBox="0 0 1200 500">
      <path d="M 36 12 L 1176 12 L 1188 32 L 1188 468 L 1164 486 L 26 486 L 10 466 L 10 34 L 24 12 Z" fill="none" stroke="color-mix(in srgb,var(--nc-cyan) 60%, transparent)" stroke-width="1.6"/>
    </svg>
    <div id="scanner"></div>
  </div>

  <div id="ncTagBar"></div>
  <div id="ncTagText"><span id="ncTagSpan">Part.02</span></div>
  <div id="ncTagCapA" style="left:462px;top:351px;"></div>
  <div id="ncTagCapB" style="left:462px;top:542px;"></div>
  <div id="ncTagScan" style="top:469px;"></div>

  <div id="titleWrap"><h1 id="titleText">如何编辑和导出</h1></div>

  <svg class="spiral" id="sp1" width="120" height="120" viewBox="0 0 100 100" style="left:272px;top:180px;"><circle cx="50" cy="50" r="44" fill="none" stroke="var(--nc-cyan)" stroke-width="3"/><circle cx="50" cy="50" r="24" fill="none" stroke="var(--nc-green)" stroke-width="2.5"/></svg>
  <svg class="zig" id="zg1" width="110" height="90" viewBox="0 0 100 70" style="left:1764px;top:200px;"><path d="M6 60 L26 60 L40 10 L62 60 L84 20 L96 60" fill="none" stroke="var(--nc-gold)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <svg class="grain" id="gn1" width="60" height="60" viewBox="0 0 100 100" style="left:240px;top:800px;"><path d="M50 0 C54.5 34 66 45.5 100 50 C66 54.5 54.5 66 50 100 C45.5 66 34 54.5 0 50 C34 45.5 45.5 34 50 0 Z" fill="#fff"/></svg>
  <svg class="zig" id="zg2" width="78" height="64" viewBox="0 0 100 70" style="left:1568px;top:920px;"><path d="M6 60 L26 60 L40 10 L62 60 L84 20 L96 60" fill="none" stroke="var(--nc-pink)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>

  <!-- 数据脉冲光点（由 JS 插入到 #stage） -->
</div></div>

<script>
"use strict";
var PRISTINE = '<!doctype html>\n' + document.documentElement.outerHTML;

/* ---------- 缓动 / 插值 / 弹簧(同 cyber2) ---------- */
var clamp=function(v,a,b){ a=a===undefined?0:a; b=b===undefined?1:b; return Math.max(a,Math.min(b,v)); };
function bezFn(x1,y1,x2,y2){
  var cx=3*x1, bx=3*(x2-x1)-cx, ax=1-cx-bx;
  var cy=3*y1, by=3*(y2-y1)-cy, ay=1-cy-by;
  function sX(t){return ((ax*t+bx)*t+cx)*t;}
  function sY(t){return ((ay*t+by)*t+cy)*t;}
  function dX(t){return (3*ax*t+2*bx)*t+cx;}
  return function(x){
    if(x<=0)return 0; if(x>=1)return 1;
    var t=x,i,e,d;
    for(i=0;i<8;i++){ e=sX(t)-x; if(Math.abs(e)<1e-5)break; d=dX(t); if(Math.abs(d)<1e-6)break; t-=e/d; }
    return sY(clamp(t,0,1));
  };
}
function interp(f,xs,ys,ease){
  if(f<=xs[0])return ys[0]; var n=xs.length;
  if(f>=xs[n-1])return ys[n-1];
  for(var i=0;i<n-1;i++){ if(f>=xs[i]&&f<=xs[i+1]){ var t=(f-xs[i])/(xs[i+1]-xs[i]); if(ease)t=ease(t); return ys[i]+(ys[i+1]-ys[i])*t; } }
  return ys[n-1];
}
function spring(frames,damping,stiffness,mass){
  if(frames<=0)return 0;
  var zeta=damping/(2*Math.sqrt(stiffness*mass));
  var w0=Math.sqrt(stiffness/mass); var t=frames/30;
  if(zeta>=1) return 1-Math.exp(-zeta*w0*t);
  var wd=w0*Math.sqrt(1-zeta*zeta);
  return 1-Math.exp(-zeta*w0*t)*(Math.cos(wd*t)+(zeta*w0/wd)*Math.sin(wd*t));
}
var E_OUT=bezFn(0.16,1,0.3,1);
var E_4021=bezFn(0.4,0,0.2,1);
var E_2213=bezFn(0.22,1,0.36,1);
var E_4501=bezFn(0.45,0,0.55,1);
var E_3413=bezFn(0.34,1.3,0.64,1);
var E_3021=bezFn(0.3,0,0.21,1);

/* ---------- 时间轴 / 几何 ---------- */
var T={
  bgIn:[0,13], gridIn:[3,18], arcDraw:[2,26],
  branchDraw:[10,24], capIn:[16,30],
  pulseStart:14,
  ballStart:8, ballArrive:74, ballMorph:[74,96],
  scanSlow:[98,146],
  tagBar:[108,126], tagText:[116,134], tagScan:[110,126], tagCap:[118,132],
  title:[122,162],
  decor:[134,164],
  idleFrom:158
};
var TRUNK_LEN, BR_LEN=[];
var PULSE_POINTS=null; // [{x,y}...] 由 getPointAtLength 采样
var DUR=165, HOLD=0.9, CYCLE=DUR/30+HOLD;

/* ---------- DOM ---------- */
function $(id){return document.getElementById(id);}
var els={ backdrop:$('backdrop'),g1:$('bdGrid1'),g2:$('bdGrid2'),side:$('bdSide'),
  trunk:$('trunk'),trunkFlow:$('trunkFlow'),
  branches:[$('br1'),$('br2'),$('br3')], caps:[$('cap1'),$('cap2'),$('cap3')],
  crystal:$('crystal'),cBorder:$('crystalBorder'),cGlass:$('crystalGlass'),scanner:$('scanner'),ball:$('ncBall'),ring:$('ncRing'),
  tagBar:$('ncTagBar'),tagText:$('ncTagText'),tagSpan:$('ncTagSpan'),
  tagScan:$('ncTagScan'),tagCapA:$('ncTagCapA'),tagCapB:$('ncTagCapB'),
  title:$('titleText'),
  spiral:$('sp1'),zigs:[$('zg1'),$('zg2')],grains:[$('gn1')] };

TRUNK_LEN=els.trunk.getTotalLength();
els.trunk.style.strokeDasharray=TRUNK_LEN+' '+TRUNK_LEN;
els.trunkFlow.style.strokeDasharray='140 '+(TRUNK_LEN+220);
for(var bi=0;bi<els.branches.length;bi++){
  var L=els.branches[bi].getTotalLength();
  BR_LEN.push(L);
  els.branches[bi].style.strokeDasharray=L+' '+L;
}
/* 采样主干路径做脉冲轨迹 */
PULSE_POINTS=[];
{
  var N=240;
  for(var p=0;p<N;p++){ PULSE_POINTS.push(els.trunk.getPointAtLength(p*TRUNK_LEN/N)); }
}
/* 3 颗脉冲光点(插入 stage) */
var stage=$('stage');
var waveEls=[];
for(var w=0;w<3;w++){
  var d=document.createElement('div'); d.className='dot'; stage.appendChild(d); waveEls.push(d);
}
/* 标题字母化（支持 \n 分行） */
var CHARS=[];
function _newLine(text){
  var d=document.createElement('div'); d.className='line';
  for(var i=0;i<text.length;i++){
    var s=document.createElement('span'); s.className='ch'; s.textContent=text[i]===' '?'\u00a0':text[i];
    d.appendChild(s);
  }
  return d;
}
function buildTitle(t,text){
  var lines=String(text==null?'':text).split('\n');
  t.textContent='';
  for(var i=0;i<lines.length;i++){ t.appendChild(_newLine(lines[i])); }
  CHARS=[].slice.call(t.querySelectorAll('.ch'));
  t.style.fontSize='126px';
  var wMax=1;
  for(i=0;i<lines.length;i++){ if(lines[i].length) wMax=Math.max(wMax,t.children[i].scrollWidth); }
  var availH=Math.max(lines.length,1)*1.12;   // 总行高系数
  var fW=Math.floor(126*1120/wMax);           // 宽度自适应
  var fH=Math.floor(205/availH);              // 高度自适应(滴出高度余量)
  t.style.fontSize=Math.max(40,Math.min(126,fW,fH))+'px';
}
buildTitle(els.title, els.title.textContent);

/* ---------- 弹跳球物理(确定性,按帧计算) ---------- */
var BALL={ ground:602, cx:1024, x0:-150, start:8, arrive:74 };
var BOUNCES=[
  [8,16,338],[24,14,250],[38,12,182],[50,11,116],[61,13,64]
];
function ballX(f){
  var r=BALL.arrive-BALL.start;
  return BALL.x0+(BALL.cx-BALL.x0)*E_4501(clamp((f-BALL.start)/r));
}
function ballState(f){
  var gov=ballX(f);
  for(var i=0;i<BOUNCES.length;i++){
    var b=BOUNCES[i], st0=b[0], dur=b[1], peak=b[2];
    if(f>=st0&&f<=st0+dur){
      var u=(f-st0)/dur;
      var y=BALL.ground - peak*4*u*(1-u);
      var sq=2*Math.sqrt(u*(1-u));
      return {x:gov,y:y,sx:1.30-0.30*sq,sy:0.70+0.30*sq};
    }
  }
  return null;
}

/* ---------- 数据脉冲轨迹散点(全局,供 render) ---------- */
function pulseAt(frac){ // frac 0..1 沿主干
  frac=((frac%1)+1)%1;
  var g=frac*(PULSE_POINTS.length-1), i=Math.floor(g), fr=g-i;
  var a=PULSE_POINTS[i], b=PULSE_POINTS[Math.min(i+1,PULSE_POINTS.length-1)];
  return {x:a.x+(b.x-a.x)*fr, y:a.y+(b.y-a.y)*fr};
}

/* ---------- 通用辉光呼吸 ---------- */
function breath(t,amp,freq,phase){ return 1+amp*Math.sin(t*freq+phase); }

/* ---------- 逐帧渲染 ---------- */
function render(f){
  /* 1 背景 */
  els.backdrop.style.opacity=interp(f,T.bgIn,[0,1],E_OUT);
  var gridIn=interp(f,T.gridIn,[0,1],E_OUT);
  els.g1.style.opacity=gridIn*0.6;
  els.g1.style.backgroundPosition=(-f*0.12)+'px '+(-f*0.09)+'px';
  els.g2.style.opacity=gridIn*0.5;
  els.g2.style.backgroundPosition=(29+f*0.08)+'px '+(41-f*0.06)+'px';
  els.side.style.opacity=0.9+0.1*Math.sin(f*0.045);

  /* 2 主干描边 */
  els.trunk.style.strokeDashoffset=interp(f,T.arcDraw,[TRUNK_LEN,0],E_4021);
  var flowStart=Math.max(0,f-T.idleFrom), cycle=TRUNK_LEN+300;
  els.trunkFlow.style.strokeDashoffset=TRUNK_LEN-((flowStart*16)%cycle);
  els.trunkFlow.style.opacity=interp(f,[T.idleFrom,T.idleFrom+12],[0,0.75]);

  /* 3 分支 + 电容节点 */
  for(var i=0;i<3;i++){
    els.branches[i].style.opacity=interp(f,T.branchDraw,[0,1],E_OUT);
    els.branches[i].style.strokeDashoffset=interp(f,T.branchDraw,[BR_LEN[i],0],E_4021);
  }
  var capD=[16,19,22];
  for(i=0;i<3;i++){
    var cs=spring(f-capD[i],11,210,0.6);
    var cidle=f>T.idleFrom?0.85+0.15*Math.sin((f-T.idleFrom)*0.08+capD[i]):1;
    els.caps[i].style.opacity=cs<0.01?0:cidle;
    els.caps[i].style.transform='scale('+cs+')';
  }

  /* 4 数据脉冲(绿光点沿主干) */
  if(f>=T.pulseStart){
    var speed=14, t=f-T.pulseStart, offs=[0,-0.33,-0.66];
    for(i=0;i<3;i++){
      var frac=(t*speed/TRUNK_LEN+offs[i]);
      var pos=pulseAt(frac);
      var fade=interp(f,[T.pulseStart,T.pulseStart+10],[0,1],E_OUT);
      waveEls[i].style.opacity=fade*(f>T.idleFrom?0.75+0.25*Math.sin((f-T.idleFrom)*0.12+i):1);
      waveEls[i].style.left=pos.x+'px'; waveEls[i].style.top=pos.y+'px';
      waveEls[i].style.transform='translate(-5px,-5px) scale('+(0.8+0.6*Math.sin(t*0.3+i*2))+')';
    }
  }

  /* 5 弹跳球 → 晶体面板(球落中心后展开成形) */
  var s=ballState(f);
  var expanding=f>=T.ballMorph[0]&&f<=T.ballMorph[1];
  var m=expanding?(f-T.ballMorph[0])/(T.ballMorph[1]-T.ballMorph[0]):0;

  if(s){
    els.ball.style.opacity=1;
    els.ball.style.left=s.x+'px'; els.ball.style.top=s.y+'px';
    els.ball.style.transform='translate(-50%,-50%) scale('+s.sx.toFixed(3)+','+s.sy.toFixed(3)+')';
    els.ring.style.opacity=0;
  } else if(expanding){
    /* 符号 → 框 丝滑弹射: 符号先小涨再向内收没, 框同步从中心 elastic 胀出 + 冲击环扩散 */
    var gs, opB;
    if(f<80){ gs=1+0.5*((f-T.ballMorph[0])/6); opB=1; }
    else { var sh=Math.min(1,(f-80)/16); gs=1.5*(1-sh); opB=1-sh; }
    els.ball.style.opacity=Math.max(0,opB);
    els.ball.style.left=BALL.cx+'px'; els.ball.style.top=BALL.ground+'px';
    els.ball.style.transform='translate(-50%,-50%) scale('+gs.toFixed(3)+')';
    var rp=(f-T.ballMorph[0])/(T.ballMorph[1]-T.ballMorph[0]); var rk=clamp(rp*1.4);
    els.ring.style.opacity=1-rk;
    els.ring.style.transform='translate(-50%,-50%) scale('+(0.3+1.7*rp).toFixed(3)+')';
  } else { els.ball.style.opacity=0; els.ring.style.opacity=0; }

  var cScale, cOp;
  if(s){ cScale=0.28; cOp=0; }
  else if(expanding){ cScale=0.28+0.72*E_3413(clamp(m)); cOp=E_OUT(m); }
  else { cScale=1; cOp=1; }
  els.crystal.style.opacity=cOp;
  els.crystal.style.transform='scale('+cScale.toFixed(3)+')';
  var idleGlow=f>T.idleFrom?breath(f-T.idleFrom,0.1,0.06,0):1;
  var glow=cOp*idleGlow;
  els.crystal.style.filter='drop-shadow(0 0 '+(18*glow)+'px '+colorMix('--nc-pink',0.4*glow)+') drop-shadow(0 0 '+(48*glow)+'px '+colorMix('--nc-cyan',0.35*glow)+')';
  els.cBorder.style.opacity=interp(f,[T.ballMorph[0],T.ballMorph[0]+18],[0,1],E_OUT);
  els.cGlass.style.opacity=interp(f,[T.ballMorph[0]+6,T.ballMorph[0]+24],[0,1],E_OUT);

  /* 扫描线(慢速: 一次长扫 + idle 慢速往复) */
  if(f>=T.scanSlow[0]){
    var scTop, scO;
    if(f<=T.scanSlow[1]){
      scTop=interp(f,T.scanSlow,[30,430],E_3021);
      scO=interp(f,[94,102,T.scanSlow[1]-8,T.scanSlow[1]],[0,1,1,0]);
    } else {
      var ph=f-T.scanSlow[1]; scO=0.55;
      scTop=30+(430-30)*(0.5+0.5*Math.sin(ph*0.045));
    }
    els.scanner.style.top=scTop+'px'; els.scanner.style.opacity=scO;
  }

  /* 6 章节标签 */
  els.tagBar.style.transform='skewX(-14deg) scaleX('+interp(f,T.tagBar,[0,1],E_2213)+')';
  els.tagText.style.opacity=interp(f,T.tagText,[0,1],E_OUT);
  els.tagText.style.transform='translateX('+interp(f,T.tagText,[-34,0],E_OUT)+'px)';
  els.tagScan.style.top=(469+interp(f,T.tagScan,[0,40],E_2213))+'px';
  els.tagScan.style.opacity=interp(f,T.tagScan,[0,1],E_2213);
  var tA=spring(f-(T.tagCap[0]),12,230,0.5), tB=spring(f-(T.tagCap[0]+5),12,230,0.5);
  els.tagCapA.style.opacity=tA>0.01?1:0; els.tagCapA.style.transform='translate(-6.5px,-6.5px) scale('+tA+')';
  els.tagCapB.style.opacity=tB>0.01?1:0; els.tagCapB.style.transform='translate(-4.5px,-4.5px) scale('+tB+')';

  /* 7 主标题(字母逐字上浮错位) */
  if(f<T.title[0]){
    els.title.style.opacity=0;
    for(var c=0;c<CHARS.length;c++){ CHARS[c].style.opacity=0; }
  } else {
    els.title.style.opacity=1;
    for(c=0;c<CHARS.length;c++){
      var cd=f-T.title[0]+c*2.2;
      var rise=interp(f,[T.title[0]+c*2.2,T.title[0]+c*2.2+24],[110,-4],E_OUT);
      var st=spring(Math.max(0,cd-24),12,160,0.7);
      var y=cd<=24?rise:(f>=T.title[0]+c*2.2+26?-4+(-3.5-(-4))*0:rise);
      if(cd>24){ y=-4+(0-(-4))*Math.min(1,st); }
      CHARS[c].style.opacity=cd<=0?0:1;
      CHARS[c].style.transform='translateY('+y+'px)';
    }
    var tg=f>T.title[0]+26?breath(f-T.idleFrom,0.12,0.055,0):1;
    els.title.style.textShadow='0 5px 16px rgba(0,0,0,.65), 0 0 '+(28*tg)+'px '+colorMix('--nc-cyan',0.32*tg)+', 0 0 '+(60*tg)+'px '+colorMix('--nc-green',0.22*tg);
  }

  /* 8 环境粒子 */
  var sp=spring(f-T.decor[0],11,190,0.55);
  var z1=spring(f-(T.decor[0]+2),11,190,0.55);
  var z2=spring(f-(T.decor[0]+6),11,190,0.55);
  var gn=spring(f-(T.decor[0]+4),11,190,0.55);
  var idle=f>T.idleFrom?1:0;
  var iRot=(f-T.decor[0])*1.2;
  els.spiral.style.transform='scale('+sp+') rotate('+((1-sp)*-30+iRot)+'deg)';
  els.spiral.style.opacity=sp*(f>T.idleFrom?0.75+0.25*Math.sin((f-T.idleFrom)*0.09):1);
  els.spiral.style.filter='drop-shadow(0 0 8px '+colorMix('--nc-cyan',0.6)+") drop-shadow(0 0 20px "+colorMix('--nc-pink',0.4)+")";
  setParticle(els.zigs[0],z1,f,false);
  setParticle(els.zigs[1],z2,f,true);
  setParticle(els.grains[0],gn,f,false);
}
function setParticle(el,s,f,isGold){
  if(!s||s<=0.01){ el.style.opacity=0; return; }
  var tw=f>T.idleFrom?0.75+0.25*Math.sin((f-T.idleFrom)*0.1):1;
  var br=f>T.idleFrom?1+0.08*Math.sin((f-T.idleFrom)*0.08):1;
  var col=isGold?'--nc-gold':'--nc-pink';
  el.style.opacity=s*tw;
  el.style.transform='scale('+(s*br)+') rotate('+((1-s)*-40)+'deg)';
  el.style.filter='drop-shadow(0 0 8px '+colorMix(col,0.7)+') drop-shadow(0 0 18px '+colorMix(col,0.45)+')';
}
function colorMix(v,alphaPct){
  return 'color-mix(in srgb, '+ (v.charAt(0)==='-'?('var('+v+')'):v) +' '+Math.round(alphaPct*100)+'%, transparent)';
}
var _varCache={};
function cssVar(name){
  if(!_varCache[name]) _varCache[name]=getComputedStyle(document.documentElement).getPropertyValue(name).trim()||'#fff';
  return _varCache[name];
}

/* ---------- 播放循环 ---------- */
var startAt=performance.now(), rafId=0;
function tick(now){
  var t=((now-startAt)/1000)%CYCLE;
  var f=Math.min(DUR, t*30);
  render(f);
  rafId=requestAnimationFrame(tick);
}
function restart(){ startAt=performance.now(); }
function fit(){
  /* ⚠️ 不要加放大上限（曾经是 ,1）：导出降级链路把画布撑到 1080P/4K 时要能铺满，否则四周黑边 */
  var s=Math.min(innerWidth/2048, innerHeight/1152);
  var st=document.getElementById('stage'), wr=document.getElementById('wrap');
  st.style.transform='scale('+s+')';
  wr.style.width=(2048*s)+'px'; wr.style.height=(1152*s)+'px';
}
window.addEventListener('resize',fit);

/* ---------- 配置 / 配色 ---------- */
var cfg={part:"Part.02",title:"如何编辑和导出"};
function applyCfg(c){
  if(c.part!=null){ cfg.part=c.part; els.tagSpan.textContent=c.part; }
  if(c.title!=null){
    cfg.title=c.title;
    buildTitle(els.title, c.title);
  }
}
function applyColors(vars){
  var root=document.documentElement.style,k;
  for(k in vars){ if(k.indexOf('--nc-')===0) root.setProperty(k,vars[k]); }
  _varCache={};
}

/* ---------- postMessage 桥(同 cyber2) ---------- */
window.addEventListener('message',function(e){
  var d=e.data||{};
  if(d.source!=='host')return;
  try{
    if(d.type==='cyber-embed'){ document.body.classList.add('embed'); fit(); }
    else if(d.type==='cyber-cfg'){ applyCfg(d); if(d.replay)restart(); }
    else if(d.type==='cyber-color'){ applyColors(d.vars||{}); }
    else if(d.type==='cyber-play'){ restart(); if(!rafId) rafId=requestAnimationFrame(tick); }
    else if(d.type==='cyber-seek'){
      if(rafId){ try{ cancelAnimationFrame(rafId); }catch(e){} rafId=0; }
      if(typeof d.t==='number'){ try{ render(Math.min(DUR,d.t*30)); }catch(err){} }
    }
    else if(d.type==='cyber-resume'){ startAt=performance.now(); if(!rafId) rafId=requestAnimationFrame(tick); }
    else if(d.type==='cyber-get-html'){
      var varNames=['--nc-bg1','--nc-bg2','--nc-bg3','--nc-cyan','--nc-green','--nc-pink','--nc-gold'];
      window.__NC_LASTVARS=window.__NC_LASTVARS||{};
      var cs=getComputedStyle(document.documentElement), host={};
      varNames.forEach(function(vn){ host[vn]=cs.getPropertyValue(vn).trim(); });
      var ovr=':root{'+varNames.map(function(vn){return vn+':'+host[vn];}).join(';')+'}';
      var boot='<script>window.__NC_BOOT='+JSON.stringify({part:cfg.part,title:cfg.title})+'<\/script>';
      var html=PRISTINE.replace('</head>','<style id="nc-override">'+ovr+'</style>'+boot+'</head>');
      parent.postMessage({source:'cyber',type:'cyber-html',reqId:d.reqId,html:html},'*');
    }
  }catch(err){ parent.postMessage({source:'cyber',type:'cyber-status',err:err.message},'*'); }
});

/* ---------- 启动 ---------- */
if(window.__NC_BOOT){ applyCfg(window.__NC_BOOT); }
fit();
render(0);
rafId=requestAnimationFrame(tick);
parent.postMessage({source:'cyber',type:'cyber-ready'},'*');
window.seek=function(sec){ startAt=performance.now()-sec*1000; };
window.play=restart;
</script>
