<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Cloud Pop Collision — 动态标题动画</title>
<style id="tpl-style">
:root{
  --sky-top:#7EC8E3;
  --sky-bot:#4A90C4;
  --cloud:#FFFFFF;
  --txt:#FFFFFF;
  --txt-dark:#1A3A5C;
  --txt-stroke:#2C3E50;
  --accent:#E8734A;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0b0d12;overflow:hidden;font-family:"PingFang SC","HarmonyOS Sans","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;user-select:none}
/* ===== 编辑面板 ===== */
#panel{flex-shrink:0;display:flex;align-items:center;gap:14px;padding:12px 18px;background:linear-gradient(180deg,rgba(91,163,217,.92),rgba(74,144,217,.92));border-bottom:1px solid rgba(255,255,255,.35);backdrop-filter:blur(10px);color:#fff;font:600 14px/1 "PingFang SC",sans-serif;flex-wrap:wrap}
#panel .field{display:flex;flex-direction:column;gap:5px}
#panel .field label{font-size:11px;color:rgba(255,255,255,.75);letter-spacing:.5px}
#panel input,#panel textarea{width:160px;padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.15);color:#fff;font:700 14px "PingFang SC",sans-serif;outline:none;font-family:inherit}
#panel textarea{height:50px;resize:none;line-height:1.3}
#panel input:focus,#panel textarea:focus{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.2)}
#panel button{padding:9px 15px;border-radius:10px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.2);color:#fff;font:700 14px "PingFang SC",sans-serif;cursor:pointer}
#panel button:hover{background:rgba(255,255,255,.3)}
#panel button.primary{background:rgba(229,57,53,.8);border-color:#E53935}
#panel button.primary:hover{background:#E53935}
#panel .hint{margin-left:auto;font-size:11px;color:rgba(255,255,255,.7);max-width:340px;text-align:right;line-height:1.5}
#panel.hidden{display:none}
/* ===== 预览视口 ===== */
#viewport{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#0b0d12}
#frame{position:relative;overflow:hidden}
/* ===== 舞台 1280x720 ===== */
#stage{width:1280px;height:720px;flex-shrink:0;position:relative;overflow:hidden;background:linear-gradient(175deg,var(--sky-top) 0%,var(--sky-bot) 100%)}
#fadein{position:absolute;inset:0;background:#0b0d12;pointer-events:none;opacity:1;z-index:100}

/* ===== Part.01 标签组件（加大版） ===== */
#part-label{position:absolute;left:56px;top:40px;z-index:25;opacity:0;transform-origin:0 0}
#part-label .pl-bg{background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.4);border-radius:12px;padding:12px 28px;backdrop-filter:blur(12px);box-shadow:0 4px 16px rgba(0,0,0,.1),inset 0 1px 0 rgba(255,255,255,.25)}
#part-label .pl-text{font:900 26px/1 "Arial Black","Impact","PingFang SC",sans-serif;color:#fff;letter-spacing:4px;
  text-shadow:0 2px 6px rgba(44,62,80,.25)}
#part-label .pl-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);margin-right:10px;vertical-align:middle;box-shadow:0 0 8px rgba(232,115,74,.5)}

/* ===== 主体产品图容器（GPU 优化） ===== */
#product-wrap{position:absolute;left:390px;top:0px;width:500px;height:460px;transform-origin:50% 100%;z-index:10;
  will-change:transform;transform:translate3d(0,var(--py,0),0) scale(var(--psx,1),var(--psy,1))}
#product-img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 16px 40px rgba(0,0,0,.15))}

/* ===== 装饰云朵（替代原四肢） ===== */
.deco-cloud{position:absolute;z-index:6;opacity:0}
.deco-cloud .dc{position:absolute;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff 0%,#f0f4f8 60%,#e0e8f0 100%);box-shadow:0 2px 8px rgba(0,0,0,.08)}
/* 左云 */
.dc-l{left:260px;top:200px}
.dc-l .dc1{left:0;top:10px;width:50px;height:45px}
.dc-l .dc2{left:20px;top:0;width:40px;height:38px}
.dc-l .dc3{left:35px;top:15px;width:35px;height:32px}
/* 右云 */
.dc-r{left:920px;top:200px}
.dc-r .dc1{left:0;top:10px;width:50px;height:45px}
.dc-r .dc2{left:15px;top:0;width:40px;height:38px}
.dc-r .dc3{left:30px;top:15px;width:35px;height:32px}
/* 左下云 */
.dc-bl{left:460px;top:470px}
.dc-bl .dc1{left:0;top:8px;width:40px;height:36px}
.dc-bl .dc2{left:15px;top:0;width:32px;height:30px}
.dc-bl .dc3{left:28px;top:12px;width:28px;height:26px}
/* 右下云 */
.dc-br{left:700px;top:470px}
.dc-br .dc1{left:0;top:8px;width:40px;height:36px}
.dc-br .dc2{left:15px;top:0;width:32px;height:30px}
.dc-br .dc3{left:28px;top:12px;width:28px;height:26px}

/* ===== 底部云层（只露上半截） ===== */
#bottom-clouds{position:absolute;left:0;right:0;bottom:-90px;height:200px;z-index:5;pointer-events:none;opacity:0}
.bc{position:absolute;border-radius:50%;background:radial-gradient(circle at 40% 30%,#fff 0%,#f5f8fb 50%,#e8eef4 100%);box-shadow:0 -2px 12px rgba(0,0,0,.06)}
.bc1{left:-30px;bottom:30px;width:280px;height:160px}
.bc2{left:180px;bottom:10px;width:320px;height:180px}
.bc3{left:420px;bottom:20px;width:260px;height:150px}
.bc4{left:620px;bottom:10px;width:300px;height:170px}
.bc5{left:860px;bottom:25px;width:240px;height:140px}
.bc6{left:1020px;bottom:15px;width:290px;height:165px}
.bc7{left:1200px;bottom:30px;width:200px;height:130px}

/* ===== 标题（专业排版：层级清晰） ===== */
#title-wrap{position:absolute;left:100px;top:370px;width:1080px;height:100px;display:flex;justify-content:center;align-items:flex-end;gap:4px;z-index:20}
.title-ch{font:900 78px/.92 "Arial Black","Impact","PingFang SC",sans-serif;color:var(--txt);letter-spacing:6px;display:inline-block;
  -webkit-text-stroke:1px var(--txt-stroke);paint-order:stroke fill;
  text-shadow:2px 2px 0 rgba(44,62,80,.25),0 0 20px rgba(255,255,255,.2);
  transform-origin:50% 100%;opacity:0}
/* 副标题（隐藏） */
#sub-title{position:absolute;left:0;right:0;top:520px;text-align:center;font:700 32px/1 "Arial Black","Impact","PingFang SC",sans-serif;color:var(--txt);letter-spacing:10px;
  -webkit-text-stroke:2px var(--txt-stroke);text-shadow:2px 2px 0 rgba(44,62,80,.2);opacity:0;z-index:20}

/* ===== 纸飞机 ===== */
#plane{position:absolute;z-index:15;opacity:0}
#plane svg{width:48px;height:36px}
.plane-trail{position:absolute;height:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5));border-radius:1px;opacity:0;z-index:14}
.trail1{width:60px}.trail2{width:40px}.trail3{width:25px}

/* ===== 线稿小云 ===== */
#outline-cloud{position:absolute;left:80px;top:430px;width:120px;height:90px;z-index:12;opacity:0;transform-origin:50% 50%}
.oc-body{position:absolute;border:2.5px solid rgba(255,255,255,.6);border-radius:50%;background:transparent}
.oc1{left:10px;top:15px;width:50px;height:45px}
.oc2{left:35px;top:5px;width:40px;height:38px}
.oc3{left:60px;top:18px;width:35px;height:32px}
.oc-face{position:absolute;z-index:13}
.oc-eye{position:absolute;width:6px;height:7px;border-radius:50%;background:rgba(255,255,255,.6)}
.oc-eye-l{left:30px;top:35px}.oc-eye-r{left:55px;top:35px}
.oc-smile{position:absolute;left:35px;top:48px;width:20px;height:10px}
.oc-smile path{fill:none;stroke:rgba(255,255,255,.6);stroke-width:2;stroke-linecap:round;stroke-dasharray:30;stroke-dashoffset:30}

/* ===== 底部文字区（专业分隔 + 层级重排） ===== */
#bottom-sep{position:absolute;left:56px;right:56px;bottom:100px;height:1px;background:linear-gradient(90deg,transparent,rgba(26,58,92,.15) 20%,rgba(26,58,92,.15) 80%,transparent);z-index:19;opacity:0}
#bottom-text{position:absolute;left:0;right:0;bottom:28px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 56px;z-index:20;opacity:0}
.bt-left{font:800 32px/.9 "Arial Black","Impact","PingFang SC",sans-serif;color:var(--txt-dark);letter-spacing:5px;
  -webkit-text-stroke:0;opacity:.85}
.bt-center{font:600 16px/1 "PingFang SC","Microsoft YaHei",sans-serif;color:var(--txt-dark);letter-spacing:6px;
  -webkit-text-stroke:0;opacity:.55;text-transform:uppercase}
.bt-right{font:800 28px/.9 "Arial Black","Impact","PingFang SC",sans-serif;color:var(--txt-dark);letter-spacing:4px;
  -webkit-text-stroke:0;opacity:.8}

/* ===== 右侧竖排文字（精致版） ===== */
#cn-label{position:absolute;right:44px;top:40px;font:500 15px/1.6 "PingFang SC","Microsoft YaHei",sans-serif;color:var(--txt);text-align:right;letter-spacing:5px;
  text-shadow:0 1px 4px rgba(44,62,80,.2);opacity:0;z-index:20;writing-mode:vertical-rl}

/* ===== 辅助说明（精致版） ===== */
#aux-text{position:absolute;left:56px;bottom:130px;font:500 10px/1.8 "PingFang SC",sans-serif;color:rgba(26,58,92,.45);letter-spacing:2px;text-transform:uppercase;opacity:0;z-index:20}
</style>
</head>
<body>
<div id="panel">
  <div class="field"><label>Part 标签</label><input id="in-part-tag" value="Part.01" spellcheck="false"></div>
  <div class="field"><label>主标题（回车分行）</label><textarea id="in-title" spellcheck="false">BEYOND
CLOUD</textarea></div>
  <div class="field"><label>副标题</label><input id="in-sub" value="" placeholder="选填 · 留空隐藏" spellcheck="false"></div>
  <div class="field"><label>右侧文字</label><input id="in-cn" value="名称1" spellcheck="false"></div>
  <div class="field"><label>右下文字</label><input id="in-br" value="名称2" spellcheck="false"></div>
  <div class="field"><label>主体图（上传替换）</label><input id="in-img" type="file" accept="image/*" style="width:180px;padding:6px 8px;font-size:12px"></div>
  <button id="btn-play" class="primary">▶ 播放</button>
  <button id="btn-export">⬇ 导出这一版</button>
  <div class="hint">产品图弹跳 → 字母坠落碰撞 → 云朵甩入 → 飞机穿越 → 全元素 idle 呼吸</div>
</div>

const auxText=document.getElementById('aux-text');

let titleChars=[];
let cfg={title:'BEYOND\nCLOUD',sub:'',part:'名称1',partTag:'Part.01',br:'名称2'};

/* ===== 缓动 ===== */
function cubic(t,x1,y1,x2,y2){
  const bx=t=>3*(1-t)*(1-t)*t*x1+3*(1-t)*t*t*x2+t*t*t;
  const by=t=>3*(1-t)*(1-t)*t*y1+3*(1-t)*t*t*y2+t*t*t;
  const dx=t=>3*(1-t)*(1-t)*x1+6*(1-t)*t*(x2-x1)+3*t*t*(1-x2);
  let u=t;for(let i=0;i<8;i++){const err=bx(u)-t;if(Math.abs(err)<1e-4)break;u-=err/dx(u);}
  return by(u);
}
const easeOut=t=>cubic(t,0.16,1,0.3,1);
const easeInOut=t=>cubic(t,0.65,0,0.35,1);
const easeOutBack=t=>{const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const spring=t=>{if(t<=0)return 0;if(t>=1)return 1;return Math.min(1.12,1-Math.cos(t*Math.PI*1.5)*Math.exp(-t*5.5));};
const clamp=v=>Math.max(0,Math.min(1,v));
const lerp=(a,b,t)=>a+(b-a)*t;
function seg(t,s,e,a,b,fn){if(t<s)return a;if(t>=e)return b;return lerp(a,b,fn(clamp((t-s)/(e-s))));}

/* ===== 构建标题 ===== */
function buildTitle(text){
  titleWrap.innerHTML='';
  const lines=(text||'BEYOND').split('\n');
  titleChars=[];
  lines.forEach((line,li)=>{
    const row=document.createElement('div');
    row.style.display='flex';row.style.gap='6px';row.style.justifyContent='center';row.style.width='100%';
    if(li>0) row.style.marginTop='4px';
    [...line].forEach(c=>{
      const s=document.createElement('span');s.className='title-ch';s.textContent=c===' '?'\u00a0':c;
      row.appendChild(s);titleChars.push({el:s,line:li});
    });
    titleWrap.appendChild(row);
  });
  const maxLen=Math.max(...lines.map(l=>l.length));
  const fs=maxLen>6?Math.max(44,Math.floor(78*6/maxLen)):78;
  titleChars.forEach(ch=>{ch.el.style.fontSize=fs+'px';});
}

/* ===== 主渲染 ===== */
function applyAll(t){
  /* 0. 淡入 */
  fadeEl.style.opacity=String(1-clamp(t/0.35));

  /* 1. Part.01 标签精致入场 (0.3~1.0) */
  const plK=seg(t,0.3,1.0,0,1,spring);
  const plScale=lerp(0,1,plK);
  const plRotate=lerp(-6,0,plK);
  const plX=lerp(-16,0,plK);
  partLabel.style.opacity=String(seg(t,0.3,0.5,0,1,easeOut));
  partLabel.style.transform=`translate3d(${plX}px,0,0) scale(${plScale}) rotate(${plRotate}deg)`;

  /* 2. 产品图弹入 (0.5~1.3) — 单次弹跳 easeOutBack，弹完锁死 */
  const pk=seg(t,0.5,1.3,0,1,easeOutBack);
  const prodY=lerp(120,0,pk);
  const prodSY=seg(t,0.5,1.3,0.90,1.0,easeOutBack);
  const prodSX=seg(t,0.5,1.3,1.06,1.0,easeOutBack);
  productWrap.style.setProperty('--py',prodY+'px');
  productWrap.style.setProperty('--psx',String(prodSX));
  productWrap.style.setProperty('--psy',String(prodSY));
  productWrap.style.opacity=String(seg(t,0.5,0.7,0,1,easeOut));

  /* 3. 标题整行坠落 (1.2~2.0) — 同时出现只做坠落，无 scale 无 stagger */
  const titleStart=1.2, titleEnd=2.0;
  const titleK=seg(t,titleStart,titleEnd,0,1,easeOut);
  const titleY=lerp(-80,0,titleK);
  titleChars.forEach((ch)=>{
    ch.el.style.opacity=String(seg(t,titleStart,titleStart+0.3,0,1,easeOut));
    ch.el.style.transform=`translate3d(0,${titleY}px,0)`;
  });

  /* 3b. 副标题 (2.2~2.8) */
  subTitle.textContent=cfg.sub;
  subTitle.style.display=(cfg.sub&&cfg.sub.trim())?'block':'none';
  if(cfg.sub&&cfg.sub.trim()){
    subTitle.style.opacity=String(seg(t,2.2,2.8,0,1,easeOut));
    subTitle.style.transform=`translate3d(0,${seg(t,2.2,2.8,18,0,easeOut)}px,0)`;
  }

  /* 4. 装饰云朵弹入 (2.4~3.2) */
  const dcPositions=[
    {x:0,y:30,rot:-10},   /* dc-l: 从左下弹 */
    {x:0,y:30,rot:10},    /* dc-r: 从右下弹 */
    {x:0,y:25,rot:-5},    /* dc-bl */
    {x:0,y:25,rot:5},     /* dc-br */
  ];
  decoClouds.forEach((dc,i)=>{
    const ds=2.4+i*0.12, de=ds+0.5;
    const dcK=seg(t,ds,de,0,1,spring);
    const dcy=lerp(dcPositions[i].y,0,dcK);
    const dcr=lerp(dcPositions[i].rot,0,dcK);
    dc.style.opacity=String(seg(t,ds,ds+0.2,0,1,easeOut));
    dc.style.transform=`translate3d(0,${dcy}px,0) rotate(${dcr}deg)`;
  });

  /* 4b. 云朵碰字母 —— 移除（会导致标题定住后又被撞动） */

  /* 5. 底部云层升起 (3.0~3.8) */
  bottomClouds.style.opacity=String(seg(t,3.0,3.8,0,1,easeOut));
  bottomClouds.style.transform=`translate3d(0,${seg(t,3.0,3.8,40,0,easeOut)}px,0)`;

  /* 6. 纸飞机穿越 (3.2~4.4) */
  const planeK=seg(t,3.2,4.4,0,1,easeInOut);
  const px=lerp(1100,80,planeK);
  const py=lerp(60,480,planeK)+Math.sin(planeK*Math.PI*2)*25;
  const pang=lerp(-15,25,planeK)+Math.sin(planeK*Math.PI*3)*4;
  plane.style.transform=`translate3d(${px}px,${py}px,0) rotate(${pang}deg)`;
  plane.style.opacity=String(seg(t,3.2,3.4,0,1,easeOut));
  trails.forEach((tr,i)=>{
    const ts=3.2+i*0.07;
    tr.style.left=(px-18-i*22)+'px';tr.style.top=(py+16)+'px';
    tr.style.opacity=String(seg(t,ts,ts+0.25,0,0.35*(1-i*0.25),easeOut));
    tr.style.transform=`rotate(${pang}deg)`;
  });

  /* 7. 线稿小云 pop (3.8~4.4) */
  const ocK=seg(t,3.8,4.4,0,1,spring);
  outlineCloud.style.transform=`scale(${lerp(0,1,ocK)}) rotate(${lerp(-8,0,ocK)}deg)`;
  outlineCloud.style.opacity=String(seg(t,3.8,4.0,0,1,easeOut));
  const ocSmile=document.querySelector('.oc-smile path');
  if(ocSmile) ocSmile.style.strokeDashoffset=String(seg(t,4.1,4.5,30,0,easeOut));
  const ocBlinkK=seg(t,4.3,4.42,0,1,easeInOut);
  const ocBlinkSY=ocBlinkK<0.5?lerp(1,0.1,ocBlinkK*2):lerp(0.1,1,(ocBlinkK-0.5)*2);
  if(t>=4.3&&t<4.42){[...document.querySelectorAll('.oc-eye')].forEach(e=>e.style.transform=`scaleX(1) scaleY(${ocBlinkSY})`);}

  /* 8. 右侧文字 (4.0~4.6) */
  cnLabel.textContent=cfg.part;
  cnLabel.style.opacity=String(seg(t,4.0,4.6,0,1,easeOut));
  cnLabel.style.transform=`translate3d(${seg(t,4.0,4.6,15,0,easeOut)}px,0,0)`;

  /* 9. 底部文字滑入 + 分隔线 (4.2~4.9) */
  bottomSep.style.opacity=String(seg(t,4.0,4.5,0,1,easeOut));
  bottomText.style.opacity=String(seg(t,4.2,4.9,0,1,easeOut));
  bottomText.style.transform=`translate3d(0,${seg(t,4.2,4.9,20,0,easeOut)}px,0)`;

  /* 10. 辅助文字 (4.5~5.0) */
  auxText.style.opacity=String(seg(t,4.5,5.0,0,1,easeOut));

  /* 11. Idle 微动 (5.0+) — 主体图定住不动，只保留装饰云和飞机微动 */
  if(t>=5.0){
    const idleT=t-5.0;
    /* 主体图锁定终值，不伸缩 */
    productWrap.style.setProperty('--py','0px');
    productWrap.style.setProperty('--psx','1');
    productWrap.style.setProperty('--psy','1');
    /* 装饰云轻微浮动 */
    const cloudBob=Math.sin(idleT*Math.PI*0.5)*1.5;
    decoClouds.forEach((dc,i)=>{
      const offset=[0,0.3,0.15,0.45][i];
      const bob=Math.sin((idleT+offset)*Math.PI*0.6)*cloudBob;
      dc.style.transform=`translate3d(0,${bob}px,0)`;
    });
    /* 纸飞机缓绕 */
    const circleK=((idleT*0.25)%1);
    const cpx=130+Math.cos(circleK*Math.PI*2)*35;
    const cpy=460+Math.sin(circleK*Math.PI*2)*18;
    plane.style.transform=`translate3d(${cpx}px,${cpy}px,0) rotate(${-8+circleK*16}deg)`;
  }
}

/* ===== 播放控制 ===== */
let startTime=0,paused=false,rafId=null;
function tick(now){if(paused)return;if(!startTime)startTime=now;const elapsed=((now-startTime)/1000)%CYCLE;applyAll(elapsed);rafId=requestAnimationFrame(tick);}
function play(){paused=false;startTime=0;if(rafId)cancelAnimationFrame(rafId);rafId=requestAnimationFrame(tick);}
function seek(t){paused=true;applyAll(Math.max(0,Math.min(DURATION,t)));}
window.__cloudEngine={play,seek,applyAll,rebuild:function(){buildTitle(cfg.title);}};

/* ===== 初始化 ===== */
buildTitle(cfg.title);
/* 初始化 CSS 变量 */
productWrap.style.setProperty('--py','0px');
productWrap.style.setProperty('--psx','1');
productWrap.style.setProperty('--psy','1');
play();

/* ===== 适配 ===== */
const viewportEl=document.getElementById('viewport');
const frameEl=document.getElementById('frame');
function fit(){
  const vw=viewportEl.clientWidth,vh=viewportEl.clientHeight;
  /* ⚠️ 不要加放大上限（曾经是 ,1）：导出降级链路撑大画布时要能铺满，否则四周黑边 */
  const s=Math.min(vw/1280,vh/720);
  stage.style.position='absolute';stage.style.left='0';stage.style.top='0';
  stage.style.transformOrigin='top left';stage.style.transform='scale('+s+')';
  frameEl.style.width=(1280*s)+'px';frameEl.style.height=(720*s)+'px';
}
window.addEventListener('resize',fit);fit();

/* ===== 编辑控件 ===== */
const inPartTag=document.getElementById('in-part-tag');
const inTitle=document.getElementById('in-title');
const inSub=document.getElementById('in-sub');
const inCn=document.getElementById('in-cn');
const inBr=document.getElementById('in-br');
document.getElementById('part-tag-text').textContent=inPartTag.value;
inPartTag.addEventListener('input',()=>{cfg.partTag=inPartTag.value;document.getElementById('part-tag-text').textContent=inPartTag.value;});
inTitle.addEventListener('input',()=>{cfg.title=inTitle.value;buildTitle(inTitle.value);play();});
inSub.addEventListener('input',()=>{cfg.sub=inSub.value;});
inCn.addEventListener('input',()=>{cfg.part=inCn.value;});
inBr.addEventListener('input',()=>{cfg.br=inBr.value;document.getElementById('bt-right-text').textContent=inBr.value;});
/* 主体图上传替换 */
document.getElementById('in-img').addEventListener('change',function(e){
  const file=e.target.files&&e.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    document.getElementById('product-img').src=ev.target.result;
  };
  reader.readAsDataURL(file);
});
document.getElementById('btn-play').addEventListener('click',()=>play());
document.getElementById('btn-export').addEventListener('click',exportFrozen);

/* ===== 固化导出 ===== */
function buildFrozenString(){
  window.__cloudEngine.seek(5.5);
  const css=document.getElementById('tpl-style').innerHTML;
  const stageHTML=stage.outerHTML;
  return '<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>'+cfg.partTag+' '+cfg.title.replace(/\n/g,' ')+'</title><style>'+css+'</style><style>#stage{position:relative;transform-origin:50% 50%}</style></head><body style="margin:0;background:#0b0d12;display:flex;align-items:center;justify-content:center;height:100vh">'+stageHTML+'</body></html>';
}
function exportFrozen(){
  const html=buildFrozenString();
  const blob=new Blob([html],{type:'text/html'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='cloud-pop-'+cfg.partTag+'.html';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

/* ===== 宿主协议 ===== */
function tell(m){try{parent.postMessage(Object.assign({source:'cloud-pop'},m),'*');}catch(e){}}
window.addEventListener('message',(e)=>{
  const d=e.data||{};if(d.source==='cloud-pop')return;if(!d.type)return;
  try{
    switch(d.type){
      case 'cyber-cfg':
        if(typeof d.title==='string'){cfg.title=d.title;inTitle.value=d.title;buildTitle(d.title);}
        if(typeof d.part==='string'){cfg.partTag=d.part;if(inPartTag)inPartTag.value=d.part;const pt=document.getElementById('part-tag-text');if(pt)pt.textContent=d.part;}
        if(typeof d.sub==='string'){cfg.sub=d.sub;inSub.value=d.sub;}
        if(d.replay)play();
        tell({type:'cyber-status',msg:'配置已应用'});break;
      case 'cyber-seek':if(typeof d.t==='number'){try{window.__cloudEngine.seek(d.t);}catch(err){}}break;
      case 'cyber-play':play();tell({type:'cyber-status',msg:'已重播'});break;
      case 'cyber-embed':
        document.getElementById('panel').classList.add('hidden');
        viewportEl.style.padding='0';document.body.style.background='#0b0b12';fit();
        tell({type:'cyber-status',msg:'已进入宿主模式'});break;
      case 'cyber-unembed':
        // 导出结束回到编辑态：本引擎未接入 preset-editor 表单，靠自带 #panel 改文案，
        // 所以必须把面板还回来（只隐藏不还原 = 用户改不了字）。
        document.getElementById('panel').classList.remove('hidden');
        viewportEl.style.padding='';document.body.style.background='';fit();
        tell({type:'cyber-status',msg:'已退出宿主模式'});break;
      case 'cyber-get-html':tell({type:'cyber-html',reqId:d.reqId,html:buildFrozenString()});break;
    }
  }catch(err){tell({type:'cyber-status',err:String(err)});}
});
window.addEventListener('load',()=>tell({type:'cyber-ready'}));
</script>
</body>
</html>
