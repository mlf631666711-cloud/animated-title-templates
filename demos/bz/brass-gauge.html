    ⑫ ★【文字安全区先量"谁在旁边"】：右列文字 x 1360..1900 / y 132..431（整栏上移，把右下让给窗）

         齿轮（y≤301）三者优先级都不相交；
       窗内状态小字 prodTag 摆在表盘正下方【刻度缺口】里（θ=90 那 90° 区间没有任何刻度/数字）；
    ⑬ 36 条细刻度不许 36 次属性写 ⇒ 建成【12 组 × 3 条】+ 一组整点长刻度，每帧最多 13 次 opacity 写；
    ⑰ ★【跨色相的两色之间不许直接拉渐变，压暗一律走 alpha】：盘面是【实色琥珀】+ 一层偏左上光源的
       深棕 stop-opacity（上限 0.34）盖在上面 ⇒ 盘缘读成"穹面背光"，不会像第一版 mission-badge

    ★【本张写代码时就防住的一条】：齿轮必须【同模数】，否则按齿数反比算出的 ω 会让两齿轮的
       齿面线速度不相等 ⇒ 肉眼一眼看穿"两个齿轮在互相穿过"。
       取 m=2R/t≈10.2 ⇒ t=22/14/9 与 r=112/72/46 严格配套，齿距 πm≈32 三档全等，齿高同为 13；

    ★【还有一条是上一张的教训前置】：指针的 d 写在【以表心为原点】的标准姿态（指向 +x）下，

  ★★【2026-10-03 第二轮 · 老板判「界面太过于单调了，要补充的占画面的 50-70% 占比」】

        先做的版本只有网纹/铆钉/缝线/齿轮描边 ⇒ 实测开/关差集 **3.3%** 全幅（左条 28% / 顶条 7%）。
        ⇒ 线、点元素的【质积】天然小：2px 线无论多密都盖不满画面。要"占 50-70%"必须有【实心面】。
        ⇒ 补上拼板 + 齿轮实心轮体后：背景层自身 **31.7%**（左条 95% / 顶条 83%），
           全幅"非底色"从 52% → **76%**。⚠️ 这条只能靠 on/off 双截图像素差集量，肉眼会高估。
     ★ 防"背景穿字"的做法不是逐条手算净空，而是【结构上不给它机会】：
        bzBg 整层挂 clip-path=url(#bzBgClip)，而这条剪裁路径 = 全画布矩形 【挖一个洞】
        （evenodd）：洞 = 右栏 x 1274..1920 / y 66..1080 —— 文字栏最坏墨盒与观察窗【都在里面】。
        ⇒ 网纹/缝线/铆钉/拼板在数学上【不可能】落到可编辑文字或产品图上，用户把标题改成 2 行 26 字
           也不会出现"一条纹从字里横穿"（mission-badge 的 r=322 装饰内环就是这么把字穿了的）。
        ⚠️ 洞只挖一个、且它的左边界 1274 = 右侧拼板的右边界【同一个数】。
           第一版挖了两个洞（文字栏 / 观察窗各一个），实测出来是【文字后面浮着一块浅色矩形】——
           拼板的实心面被洞沿整齐切断 = 一条不属于任何版面的直边，读成"多了一张卡"。
           合成一个洞、并让板缝与洞沿对齐之后，那条边同时是"机床背板的板缝"，artifact 变成设计。
           ⇒ 通用口径：**剪裁洞的边界必须与版面里已有的某条边重合，否则洞自己会画出一个盒子。**
        ⚠️ 两个洞也不许在 y 方向重叠：重叠区被 evenodd 数成"穿过两次 = 在内部"，洞会被填回来。
        ⚠️ 唯一的例外是本层内部自己叠本层内部（缝线从竖导管后面穿过、螺栓压在缝线上、齿轮轮体压在拼板上）
           —— 那些元素都是不透明实心件、且绘制顺序 = 后画的在上，读成"装在背板上的零件"，不是串线。
     ★ 首帧就是海报（header ⑩+⑯ 口径）：bzBg 的入场只写 group opacity、且带 0.68 下限，
        子组透明度写在 markup 里当静态值；残影齿轮的 rotate 是 f 的纯函数（常数初相位走 hash1）。
        ⚠️ 下限从 0.55 抬到 0.68：拼板成为画面主体之一之后，层闸压太低 = 首帧又洗回暗底。
     ★ 配色语义同步：tan 多了"拼板焊缝·缝线·铆钉·管箍"、olive 多了"拼板面·斜铣网纹·齿轮轮体·竖导管"
        （六格控件的含义不变，仍是那六个变量；背景只用 tan/olive/case 三色 = 不新增色相，
         避免"背景比主体抢眼"）。
-->
<style>
  /* 🔴 六个配色变量必须在这里给【默认值】：JS 里 setAttribute('stroke','var(--bz-x)')
     不带 CSS 回退，宿主没发色时整棵树解析成 black。 */
  :root{
    --bz-case:#452E16;  --bz-amber:#DC9C4D; --bz-teal:#6FB4A9;
    --bz-tan:#AB8761;   --bz-rust:#A84717;  --bz-olive:#766850;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100%;height:100%;background:#1D1309;overflow:hidden;}
  body{font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;}
  #wrap{position:absolute;left:50%;top:50%;width:1920px;height:1080px;margin:-540px 0 0 -960px;}
  #stage{position:relative;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;
    background:var(--bz-case,#452E16);}
  #hud{position:absolute;inset:0;width:1920px;height:1080px;z-index:5;}
  #hud .ln{fill:none;}
  #txt{position:absolute;inset:0;z-index:9;pointer-events:none;}
  #txt > *{position:absolute;white-space:pre;}

  /* ---------- 右列文字（Part / 主标题 / 副标题），左对齐 ---------- */
  #partTxt{left:1360px;top:132px;font-size:30px;font-weight:400;letter-spacing:8px;
    color:var(--bz-tan);opacity:0;transform:translateX(-14px);}
  #titleBox{left:1360px;top:174px;width:540px;text-align:left;}
  .tline{display:block;white-space:pre;position:relative;font-weight:500;text-align:left;
    color:var(--bz-amber);}
  /* ★ 入场动画全部写在【.tw 这一层】—— 冒烟判据量的就是 .tw 的 computed opacity，
        写在子节点上会"永远读到 1"。
     ★ translateY(-10px) scaleY(.90)：入场态只会把墨盒【缩小】，不许用 scale>1（header ⑪）。
     ★ 落影只吃 var(--bz-case)（不许硬写 rgba，否则用户改色后影字脱节）。 */
  .tw{position:relative;display:inline-block;white-space:pre;color:var(--bz-amber);opacity:0;
    transform:translateY(-10px) scaleY(.90);text-shadow:2px 3px 0 var(--bz-case);}
  #subTxt{left:1360px;top:388px;font-size:34px;font-weight:400;letter-spacing:6px;
    color:var(--bz-teal);opacity:0;transform:translateX(-14px);}

  /* ---------- 固定串（底部横贯黄铜铭牌条正中，深棕压褐黄 3.85:1） ----------
     ★ 居中用 left:条心 + translateX(-50%)，不给 div 定宽：
       定宽的盒会让 fitText 量到【盒宽】而不是【字宽】⇒ 短字也被误缩。 */
  #tagline{left:960px;top:984px;transform:translateX(-50%);font-size:26px;font-weight:500;letter-spacing:6px;
    color:var(--bz-case);opacity:0;}

  /* ---------- 独立面板 ---------- */
  #panel{position:fixed;left:14px;top:14px;z-index:50;display:flex;gap:8px;align-items:center;}
  #panel input[type=text],#panel input:not([type=file]){background:rgba(255,245,230,.92);color:#2A1B0C;
    border:1px solid #a89072;border-radius:6px;padding:6px 9px;font-size:13px;width:150px;}
  #panel button{background:#AB8761;color:#452E16;border:0;border-radius:6px;padding:7px 12px;font-size:13px;cursor:pointer;}
  body.embed #panel{display:none;}
</style>

<body>
<div id="wrap">
  <div id="stage">
    <svg id="hud" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- ★ 背景层剪裁 = 全画布矩形挖两个洞（evenodd）。洞1 = 文字栏最坏墨盒外扩 26，
             洞2 = 观察窗外扩 26 ⇒ 网纹/缝线/铆钉在数学上碰不到可编辑文字与产品图（见 header 第二段末）。

<script>
"use strict";
/* ============================== 工具 ============================== */
var $ = function(id){ return document.getElementById(id); };
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function seg(f,a,b){ return clamp((f-a)/(b-a),0,1); }                 /* 段前严格 0 */
function easeOut(p){ return 1-Math.pow(1-p,3); }
function easeInOut(p){ return p<0.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2; }
function smoother(p){ return p*p*p*(p*(p*6-15)+10); }
function hash1(n){ var x=Math.sin(n*127.1+311.7)*43758.5453; return x-Math.floor(x); }
function mk(parent,tag,attrs){
  var n=document.createElementNS('http://www.w3.org/2000/svg',tag);
  for(var k in attrs) n.setAttribute(k,attrs[k]);
  parent.appendChild(n); return n;
}
function f2(v){ return Math.round(v*100)/100; }
var FPS=30, DUR=225, HOLD=0.9, CYCLE=DUR/FPS+HOLD;

/* ============================== 版面常量（唯一真源） ============================== */
var CX=650, CY=505;                        /* 大表盘心：铜壳跨 x 216..1084 / y 71..939 */
var R_FACE=396, R_BEZ=415, W_BEZ=38;       /* 盘面半径 / 铜壳中线半径 / 壳宽 */
var A0=135, A1=405;                        /* 270° 刻度，缺口 90° 在正下方 */
var N_STEP=(A1-A0)/40;                     /* 6.75° 一格 ⇒ 41 个位，整点在 k=0/10/20/30/40 */
/* ★ 数字圈在刻度圈【外侧】(r=354 > 针尖 318)：老式黄铜压力表正是这种版面。
   ⚠️ 这不是风格选择，是【避让】—— 数字若摆在刻度内侧（第一版 r=272、针尖 364），
      定版时针身正好从 "100" 中间穿过，而指针和数字同为深棕 ⇒ 糊成一坨。
      数值判据量的是文字墨盒对画布边界，量不到"针压字"，只有肉眼看得到。 */
var R_TK_OUT=312, R_TK_IN=284, R_MAJ_IN=260, R_NUM=354;
var N_GRP=12, PER_GRP=3;                   /* 36 条细刻度 = 12 组 × 3 */
var W_A0=215, W_A1=325, W_R0=76, W_R1=228; /* 扇环机加工凹槽（装饰 · 产品位见 WIN_* 观察窗） */
var R_HUB=70, NEED_TIP=318, NEED_TAIL=62;
var PLATE_X=120, PLATE_Y=958, PLATE_W=1140;/* 铭牌条右端让给观察窗：1260 处窗边已在 1340 ⇒ 留 80px 缝 */
var TXTX=1360, TXTW=540;                   /* 右列文字（左对齐）· 整栏上移到齿轮右侧 */
var PARTY=132, PARTFS=30, PARTLS=8;
var SUBFS=34, SUBLS=6;
var TITTOP=174, TITVMAX=190, TITVB=364;     /* 标题块顶 / 竖向预算 / 墨盒底不得越过 */
var TITMAXFS=96, TITMINFS=24, LH_K=1.18;
var TAGFS=26, TAGLS=6;
/* 三齿轮：同模数 m=2R/t≈10.2 ⇒ 齿距 πm≈32 三档全等（否则齿面线速度不等，肉眼看是"互相穿过"）
   ★ 整组【搬到表盘右上沿之后】（齿轮组在 markup 里排在表盘之前 ⇒ 天然被铜壳遮住一截）：
     腾出 x 1340..1900 / y 470..1050 一整块给产品窗。老位置（齿轮右上、文字右中）放不下 560 的窗。 */
var GEARS=[{x:960,y:150,r:112,t:22},{x:1142,y:216,r:72,t:14},{x:1255,y:156,r:46,t:9}];
var TOOTH_H=13, W0=1.60;                   /* 齿高同模数 ⇒ 同齿高；W0 = 大齿轮 °/帧 */
var PH=[0,0,0];                            /* 初相位（build 里按半齿距解算一次） */

/* ★★ 产品位 = 右下【机加工圆角观察窗】560×560（老板 2026-10-03 二次判：舷窗仍偏小、产品被弧切角）
   为什么两版都不对：
   ① 表盘内的扇环：边界盒恒为 宽 2·R1·sin(θ/2) × 高 (R1−R0)，θ=110° 时 ≈2.7:1 ⇒ 数学上做不出正方形。
   ② 右下角出血四分之一圆：方图要吃满就得铺到剪裁圆的外接正方形，而那个正方形的远角恒在圆外
      （对角 √2·R > R）⇒ 产品左上角必被弧切掉。要"一像素都不切"，方图只能缩到内接正方形 = R/√2，
      R=374 时只剩 264 ⇒ 想更大就得把圆心挪进画布，而那里是文字栏。
   ③ 正解 = 圆角矩形窗：内切盒 = 窗洞本身，方图 1:1 铺满、零裁切，只有四个 R=54 的圆角各削掉

      齿轮最低点 y=301（G2 齿尖）→ Part 顶 132 在齿轮右侧（齿轮最右 1314 < 文字最左 1360）⇒ 不共面；
      铭牌条右端 1260 → 窗左 1340 留 80px。三处都是按【最坏输入】反算的，不是"看着还空"。 */
var WIN_X=1340, WIN_Y=490, WIN_S=560, WIN_R=80, WIN_F=26;  /* 窗左上角 / 边长 / 外角半径 / 铜框宽 */
var WIN_IS=WIN_S-WIN_F*2;                                   /* 图与剪裁的边长（窗洞内缩一圈框）*/

/* ---------- 机床背板 bzBg（2026-10-03 老板判"太单调"补的整层背景，见 header 末段） ----------
   净空不靠逐条手算，靠【剪裁洞】：整层吃 bzBgClip，洞 = 右栏整列（文字栏最坏墨盒 + 观察窗，各外扩 ≥26）。
   ⚠️ 洞的坐标是从 TXTX/TXTW/TITTOP/TITVMAX/SUBFS/WIN_* 反算的，改版面必须一起核：
      洞左 1274 = min(TXTX, WIN_X) − 66，且【等于右侧拼板的右边界】—— 洞沿必须压在一条已有板缝上，
      否则实心拼板被洞沿整齐切断 = 文字后面浮出一块浅色矩形（第一版两个洞正是这个毛病，肉眼抓出的）。
      洞上 66 = PARTY(132) − 66；右下推到画布边（文字与窗都靠右，留不出外沿）。 */
var BG_HATCH=38;                        /* 斜铣网纹间距（45° 一组平行线） */
/* ★ 钣金拼板：老板要的"占画面 50-70%"主要靠这一组【实心面】—— 光靠 2px 线条层

    mk(els.gears[i],'circle',{cx:g.x,cy:g.y,r:4,style:'fill:var(--bz-amber)'});
  }
}
function buildPlate(){
  /* ★ 条体几何由常量写一遍（markup 里那份只是静态兜底）⇒ 铭牌只有 PLATE_* 一个真源。
     横贯整幅（120..1800）而不是只铺在表盘下方：定版时右下是一整块空场，
     铜条拉通才压得住版面；tagline 随之居中 ⇒ 不再出现"字挤在左端、右半空着"。 */
  els.plateBar.setAttribute('x', PLATE_X);   els.plateBar.setAttribute('width', PLATE_W);
  els.plateEdge.setAttribute('x', PLATE_X);  els.plateEdge.setAttribute('width', PLATE_W);
  var xs=[PLATE_X+26, PLATE_X+PLATE_W-26], i, j;
  for(i=0;i<xs.length;i++) for(j=0;j<2;j++)
    mk(els.plateRivets,'circle',{cx:xs[i],cy:PLATE_Y+(j?54:20),r:6});
}
function buildNeedle(){
  /* ★ 刀身写在【以表心为原点、指向 +x（θ=0）】的标准姿态下 ⇒ 之后每帧只 rotate(θ,CX,CY)。
       第一版我把 d 写成从 SVG 全局原点出发 ⇒ 转的是一根"在左上角绕表心公转的针"。 */
  els.blade.setAttribute('d',
    'M'+f2(CX+NEED_TIP)+' '+CY+
    ' L'+f2(CX+NEED_TIP*0.52)+' '+f2(CY-7)+
    ' L'+f2(CX-NEED_TAIL)+' '+f2(CY-10)+
    ' L'+f2(CX-NEED_TAIL)+' '+f2(CY+10)+
    ' L'+f2(CX+NEED_TIP*0.52)+' '+f2(CY+7)+' Z');
  els.tip.setAttribute('d',
    'M'+f2(CX+NEED_TIP)+' '+CY+
    ' L'+f2(CX+NEED_TIP-46)+' '+f2(CY-5.5)+
    ' L'+f2(CX+NEED_TIP-46)+' '+f2(CY+5.5)+' Z');
}
function buildStatic(){ buildClip(); buildPlates(); buildHatch(); buildRivets(); buildSeams();
                        buildBgGears();
                        buildPipe2(); buildBezel(); buildTicks(); buildNums(); buildPort();
                        buildGears(); buildPlate(); buildNeedle(); }

/* ============================== 可编辑文字 ============================== */
var cfg={part:'Part.02', title:'满格压力', sub:'AT FULL SCALE', img:''};
var TITLE={lines:1, fs:96, lh:115, chars:1, step:2.6};

/* ★ 单行固定串的实测自适应：字号与字距【同乘 k】，缩到 fsMin 为止（不靠字数估）。
   ⚠️ getBoundingClientRect 量的是【屏幕像素】⇒ 宿主里 #stage 被 fit() 缩过，必须除回 SCALE，
      否则预览窗口越小、量出来越窄 ⇒ 长字不缩 ⇒ 溢出（数值判据在 1920 视口跑，全盲）。 */
function fitText(el, fs0, ls0, wmax, fsmin){
  el.style.fontSize=fs0+'px'; el.style.letterSpacing=ls0+'px';
  var w=0; try{ w=el.getBoundingClientRect().width/SCALE; }catch(e){ w=0; }
  if(!(w>0)) return;
  var k=wmax/w;
  if(k<1){
    var fs=Math.max(fsmin, fs0*k);
    el.style.fontSize=fs.toFixed(1)+'px';
    el.style.letterSpacing=(ls0*fs/fs0).toFixed(1)+'px';
  }
}
function buildTitle(){
  var box=els.titleBox; box.textContent='';
  var raw=(cfg.title||'').replace(/\s+$/,'');
  var lines=raw.split('\n');
  if(lines.length===1 && raw.length>8){                /* 单行过长 ⇒ 先按空格切词再硬切两行 */
    var sp=raw.lastIndexOf(' ', Math.ceil(raw.length/2));
    if(sp<0) sp=Math.floor(raw.length/2);
    lines=[raw.slice(0,sp), raw.slice(sp+1)];
  }
  lines=lines.slice(0,2);                              /* 竖向只给两行（下沿是副标题） */
  var maxLen=Math.max.apply(null, lines.map(function(s){return s.length;}));
  var fs=clamp(TXTW/(Math.max(1,maxLen)*1.06), TITMINFS, TITMAXFS);
  /* ★ 块高预算 212 = lines×fs×LH_K ⇒ fs ≤ 212/(LH_K×lines)，墨盒底自动 ≤ TITVB 694 */
  var fitV=TITVMAX/(LH_K*lines.length);
  if(fs>fitV) fs=Math.max(TITMINFS, fitV);
  var ls=Math.max(1, fs*0.015), lh=fs*LH_K, li, ci, total=0;
  for(li=0;li<lines.length;li++){
    var ln=document.createElement('div'); ln.className='tline';
    ln.style.fontSize=fs.toFixed(1)+'px'; ln.style.lineHeight=lh.toFixed(1)+'px';
    ln.style.letterSpacing=ls.toFixed(1)+'px';
    var t=lines[li], n=Math.max(1,t.length);
    for(ci=0;ci<t.length;ci++){
      var w=document.createElement('span'); w.className='tw';
      w.textContent=t.charAt(ci); ln.appendChild(w);
    }
    if(!t.length){ var nb=document.createElement('span'); nb.className='tw'; nb.innerHTML='&nbsp;'; ln.appendChild(nb); }
    box.appendChild(ln);
    total+=n;
  }
  TITLE.fs=fs; TITLE.lh=lh; TITLE.lines=lines.length; TITLE.chars=total;
  /* ★ 版式只有 TXTX/TXTW/TITTOP 一个真源 ⇒ CSS 里那份只是静态兜底，这里再写一遍。 */
  box.style.left=TXTX+'px'; box.style.width=TXTW+'px'; box.style.top=TITTOP+'px';
  /* ★ 步距按【总字数】回算：最后一个字必须在 f200 前亮完（定版判据 W3）。 */
  TITLE.step = total>1 ? Math.min(2.6, 78/(total-1)) : 2.6;
  /* 副标题挂在标题块下沿 + 24 ⇒ 一行/两行都不撞版 */
  els.subTxt.style.top=Math.round(TITTOP + lh*lines.length + 24)+'px';
}
function setProdImg(src){
  cfg.img=src||'';
  /* ⚠️ 无图 = 属性缺省（不是空串）：空串会被解析成文档 URL ⇒ 永不结束的请求 ⇒ 导出第 0 帧抓屏挂死 */
  if(cfg.img) els.prodImg.setAttribute('href', cfg.img);
  else els.prodImg.removeAttribute('href');
}
function applyCfg(d){
  var dirty=false;
  if(d.part!==undefined){ cfg.part=d.part; dirty=true; }
  if(d.title!==undefined){ cfg.title=d.title; dirty=true; }
  if(d.sub!==undefined){ cfg.sub=d.sub; dirty=true; }
  els.partTxt.textContent=cfg.part||' ';
  els.subTxt.textContent =cfg.sub||' ';
  /* ★ 固定串不许复用副标题默认文本（撞词看着像重复排版），也不许放无出处的数字 */
  els.tagline.textContent='BRASS PORT · GEAR TRAIN';
  if(dirty||!els.titleBox.childNodes.length) buildTitle();
  els.partTxt.style.left=TXTX+'px'; els.partTxt.style.top=PARTY+'px';
  els.subTxt.style.left=TXTX+'px';
  els.tagline.style.left=(PLATE_X+PLATE_W/2)+'px';   /* 条心 = 居中锚点，与 PLATE_W 同一个真源 */
  /* 缩完字号才能量准：这三行顺序不许换 */
  fitText(els.partTxt, PARTFS, PARTLS, TXTW, 18);
  fitText(els.subTxt,  SUBFS,  SUBLS,  TXTW, 20);
  fitText(els.tagline, TAGFS,  TAGLS,  PLATE_W-120, 18);
  els.prodTag.textContent = cfg.img ? 'ON THE PORT' : 'EMPTY PORT';
}

/* ============================== 逐帧渲染 ============================== */
function render(f){
  var i, p;

  /* ⓪ 机床背板：整层带【下限】淡入 ⇒ 第 0 帧就已经是一张铣过的板，不是空色块（header ⑩+⑯）。
        子组的透明度写在 markup 里当静态值（拼板/网纹最轻 → 螺栓最实），这里只动层闸与残影齿轮。
        ⚠️ 下限从 0.55 抬到 0.68：拼板这一轮成为画面主体之一，层闸压太低 = 首帧又洗回暗底。 */
  var bgp=clamp(0.68+seg(f,0,34)*0.32,0,1);
  els.bg.setAttribute('opacity', bgp.toFixed(3));
  for(i=0;i<BG_GEARS.length;i++){
    els.bgG[i].setAttribute('transform','rotate('+
      f2(BG_PH[i]+BG_GEARS[i].w*f)+' '+BG_GEARS[i].x+' '+BG_GEARS[i].y+')');
  }

  /* ① 铜壳 + 盘面：🔴 半径一律不动，入场只写 opacity，且每个入场层都带【下限】
        ⇒ 第 0 帧就是一张海报（header ⑩+⑯：上一张的坑是"半径预开 62% 却被自己的 opacity 闸归零"） */
  p=clamp(0.80+seg(f,0,22)*0.20,0,1);
  els.bezel.setAttribute('opacity', p.toFixed(3));
  els.bezelShade.setAttribute('opacity', p.toFixed(3));
  p=clamp(0.55+seg(f,0,20)*0.45,0,1);
  els.bezelEdge.setAttribute('opacity', p.toFixed(3));
  els.faceEdge.setAttribute('opacity', p.toFixed(3));
  p=clamp(0.76+seg(f,0,26)*0.24,0,1);
  els.face.setAttribute('opacity', p.toFixed(3));
  els.faceShade.setAttribute('opacity', p.toFixed(3));
  els.hub.setAttribute('opacity', p.toFixed(3));
  els.hubRing.setAttribute('opacity', p.toFixed(3));
  els.hubDot.setAttribute('opacity', p.toFixed(3));

  /* ② 刻度：整点 5 条先亮（0.40 起），36 条细刻度按 12 组顺时针逐格抄亮（0.22 起 = 首帧不空） */
  els.tickMaj.setAttribute('opacity', clamp(0.40+easeOut(seg(f,2,20))*0.60,0,1).toFixed(3));
  for(i=0;i<N_GRP;i++){
    p=easeOut(seg(f, 10+i*7, 30+i*7));
    els.tickG[i].setAttribute('opacity', clamp(0.22+p*0.78,0,1).toFixed(3));
  }
  els.nums.setAttribute('opacity', easeOut(seg(f,16,54)).toFixed(3));
  els.redzone.setAttribute('opacity', (0.92*easeOut(seg(f,30,66))).toFixed(3));
  els.rivets.setAttribute('opacity', easeOut(seg(f,10,40)).toFixed(3));
  p=smoother(seg(f,26,62));
  els.bezelHi.setAttribute('stroke-dasharray','100 100');
  els.bezelHi.setAttribute('stroke-dashoffset', f2(100*(1-p)));
  els.bezelHi.setAttribute('opacity', (0.85*clamp(0.30+seg(f,26,40)*0.70,0,1)).toFixed(3));

  /* ③ 扇环机加工凹槽（纯装饰 · 产品位已搬到观察窗）：框一笔画抄出（预抄 35% ⇒ 首帧凹槽已在场） */
  p=0.35+0.65*smoother(seg(f,2,48));
  els.portRim.setAttribute('stroke-dashoffset', f2(100*(1-p)));
  els.portRim.setAttribute('opacity', clamp(0.58+seg(f,2,26)*0.42,0,1).toFixed(3));
  var po=clamp(0.55+seg(f,2,30)*0.45,0,1);
  els.portBack.setAttribute('opacity', po.toFixed(3));
  els.holder.setAttribute('opacity', (po*0.55).toFixed(3));
  els.prodTag.setAttribute('opacity', (0.90*easeOut(seg(f,40,64))).toFixed(3));

  /* ③b 产品观察窗（右下 · ★ 真正的产品位）：铜框一笔画抄出 → 镶底与图同窗淡入 → 螺钉最后亮
        ⚠️ 框与图必须同一时间窗淡入，不许"先亮框再亮图"分两段 —— 分两段的中途是一个黑洞。
        ⚠️ 0.42 的下限是给第 0 帧海报用的：右下角那块空场一开场就被窗压住，不留白。 */
  p=smoother(seg(f,58,106));
  els.phRim.setAttribute('stroke-dashoffset', f2(100*(1-p)));
  els.phEdge.setAttribute('stroke-dashoffset', f2(100*(1-p)));
  var pho=clamp(0.42+seg(f,58,100)*0.58,0,1);
  els.phRim.setAttribute('opacity', pho.toFixed(3));
  els.phEdge.setAttribute('opacity', (0.45*pho).toFixed(3));
  els.phBack.setAttribute('opacity', (0.30*pho).toFixed(3));
  els.prodImg.setAttribute('opacity', pho.toFixed(3));
  els.phBolts.setAttribute('opacity', (0.90*easeOut(seg(f,100,132))).toFixed(3));

  /* ④ 铜管：从表盘那端往齿轮那端抄出来；抄完才开始跑脉冲（脉冲全程在跑 = 定版后的"活着"） */
  p=smoother(seg(f,20,70));
  els.pipe.setAttribute('stroke-dashoffset', f2(100*(1-p)));
  els.pipeHi.setAttribute('stroke-dashoffset', f2(100*(1-p)));
  els.pipe.setAttribute('opacity', clamp(0.25+seg(f,20,40)*0.75,0,1).toFixed(3));
  els.pipeHi.setAttribute('opacity', (0.75*p).toFixed(3));
  if(f>58){
    els.pipeFlow.setAttribute('opacity','0.95');
    els.pipeFlow.setAttribute('stroke-dashoffset', f2(-(((f-58)*1.6)%100)));
  } else els.pipeFlow.setAttribute('opacity','0');

  /* ⑤ 齿轮链：ω = W0·t0/ti（齿数反比 ⇒ 齿面线速度相等）、转向逐档交替 */
  for(i=0;i<GEARS.length;i++){
    var om = W0*GEARS[0].t/GEARS[i].t*((i%2)?-1:1);
    els.gears[i].setAttribute('transform',
      'rotate('+f2(PH[i]+om*f)+' '+GEARS[i].x+' '+GEARS[i].y+')');
  }

  /* ⑥ ★ 招牌 A：指针从 0 位（135°）冲到满格（405°）—— easeOut + 过冲 + 阻尼回弹 + 定版微颤。
        全部是 f 的纯函数（不许用"上一次位置"这类状态，否则 seek 回来就错）。 */
  var s=easeOut(seg(f,6,150));
  var th=A0+(A1-A0)*s;
  if(f>140){
    var q=f-140;
    th += 6.5*Math.exp(-q/22)*Math.sin(q/5.4);      /* 过冲 + 阻尼：±6.5° 衰减 */
    th += 0.45*Math.sin(2*Math.PI*q/41);            /* 定版微颤：±0.45°，周期 41 帧 */
  }
  els.needle.setAttribute('transform','rotate('+f2(th)+' '+CX+' '+CY+')');
  els.needle.setAttribute('opacity', clamp(0.75+seg(f,0,14)*0.25,0,1).toFixed(3));

  /* ⑦ ★ 招牌 B：标题逐字【冲压落位】—— translateY(-10) scaleY(.90) → 0/1，
        入场态只缩不涨（header ⑪），与 paper-cut 的"上浮 + 放大"、mission-badge 的"水平收拢"都不撞。 */
  var ch=els.titleBox.querySelectorAll('.tw'), s0;
  for(i=0;i<ch.length;i++){
    s0=96+i*TITLE.step;
    p=easeOut(seg(f, s0, s0+15));
    ch[i].style.opacity=p.toFixed(3);
    ch[i].style.transform='translateY('+f2(-10*(1-p))+'px) scaleY('+f2(0.90+0.10*p)+')';
  }

  /* ⑧ Part / 副标题：整行从左侧（朝表盘那侧）滑进位 + 淡入 */
  p=easeInOut(seg(f,150,174));
  els.partTxt.style.opacity=p.toFixed(3);
  els.partTxt.style.transform='translateX('+f2(-14*(1-p))+'px)';
  p=easeInOut(seg(f,176,202));
  els.subTxt.style.opacity=p.toFixed(3);
  els.subTxt.style.transform='translateX('+f2(-14*(1-p))+'px)';

  /* ⑨ 底部铭牌条：整条从下沿升起 8px + 淡入，字最后亮 */
  p=easeOut(seg(f,58,92));
  els.plateBar.setAttribute('opacity', p.toFixed(3));
  els.plateEdge.setAttribute('opacity', p.toFixed(3));
  els.plateRivets.setAttribute('opacity', easeOut(seg(f,74,104)).toFixed(3));
  var dy='translate(0 '+f2(8*(1-p))+')';
  els.plateBar.setAttribute('transform', dy);
  els.plateEdge.setAttribute('transform', dy);
  els.plateRivets.setAttribute('transform', dy);
  els.tagline.style.opacity=(0.96*easeOut(seg(f,186,214))).toFixed(3);
}

/* ============================== 主循环 ============================== */
var rafId=0, startAt=performance.now();
function tick(){
  var now=performance.now();
  var t=((now-startAt)/1000)%CYCLE;
  render(Math.min(DUR, t*FPS));
  rafId=requestAnimationFrame(tick);
}
function restart(){ startAt=performance.now(); }
function fit(){
  /* ⚠️ 无放大上限（导出高清链路要求）。#stage 的 transform 归这里独占 ——
     本引擎所有运动都写在 SVG 元素或 .tw 上，都不碰 #stage。 */
  var s=Math.min(innerWidth/1920, innerHeight/1080);
  SCALE=s;
  var st=$('stage'), wr=$('wrap');
  st.style.transform='scale('+s+')';
  wr.style.width=(1920*s)+'px'; wr.style.height=(1080*s)+'px';
}
window.addEventListener('resize',fit);

/* ============================== 配色 ============================== */
var VAR_NAMES=['--bz-case','--bz-amber','--bz-teal','--bz-tan','--bz-rust','--bz-olive'];
function applyColors(vars){
  var root=document.documentElement.style, k;
  for(k in vars){ if(k.indexOf('--bz-')===0) root.setProperty(k,vars[k]); }
}

/* ============================== 自定义字体（cyber 协议） ============================== */
function applyFont(d){
  var name=d.family, url=d.dataURL;
  if(!name){ var old=document.getElementById('__bzFont'); if(old) old.remove(); return; }
  var st=document.getElementById('__bzFont')||document.createElement('style');
  st.id='__bzFont';
  st.textContent = url ? '@font-face{font-family("__bzfont");src:url('+url+') format("truetype");font-display:block;}' : '';
  if(!st.parentNode) document.head.appendChild(st);
  var fam = url ? '__bzfont' : name;
  $('stage').style.fontFamily='"'+fam+'","Noto Sans SC","Microsoft YaHei",sans-serif';
  applyCfg({});
}

/* ============================== postMessage 桥（与 vinyl / paper-cut 同协议） ============================== */
window.addEventListener('message',function(e){
  var d=e.data||{};
  if(d.source!=='host')return;
  try{
    if(d.type==='cyber-embed'){ document.body.classList.add('embed'); fit(); }
    else if(d.type==='cyber-unembed'){ document.body.classList.remove('embed'); fit(); }
    else if(d.type==='cyber-cfg'){ applyCfg(d); if(d.replay)restart(); }
    else if(d.type==='cyber-color'){ applyColors(d.vars||{}); }
    else if(d.type==='cyber-img'){ setProdImg(d.img||''); applyCfg({}); }
    else if(d.type==='cyber-font'){ applyFont(d); }
    else if(d.type==='cyber-play'){ restart(); if(!rafId) rafId=requestAnimationFrame(tick); }
    else if(d.type==='cyber-seek'){
      if(rafId){ try{ cancelAnimationFrame(rafId); }catch(err){} rafId=0; }
      /* ⚠️ d.t 单位是【秒】 */
      if(typeof d.t==='number'){ try{ render(Math.min(DUR, d.t*FPS)); void document.documentElement.offsetHeight; }catch(err){} }
    }
    else if(d.type==='cyber-resume'){
      startAt=performance.now(); if(!rafId) rafId=requestAnimationFrame(tick);
    }
    else if(d.type==='cyber-get-html'){
      var ovr='',k2;
      var cs=getComputedStyle(document.documentElement);
      for(k2=0;k2<VAR_NAMES.length;k2++){ ovr+=VAR_NAMES[k2]+':'+cs.getPropertyValue(VAR_NAMES[k2]).trim()+';'; }
      ovr=':root{'+ovr+'}';
      /* ⚠️ 本注释里不能写 script 闭合标签的字面量 —— 它会先把自己所在的 script 截断 */
      var boot='<script>window.__BZ_BOOT='+JSON.stringify({part:cfg.part,title:cfg.title,sub:cfg.sub,img:cfg.img||''}).replace(/</g,'\\u003c')+'<\/script>';
      var html=PRISTINE.replace('</head>','<style id="bz-override">'+ovr+'</style>'+boot+'</head>');
      parent.postMessage({source:'cyber',type:'cyber-html',reqId:d.reqId,html:html},'*');
    }
  }catch(err){ parent.postMessage({source:'cyber',type:'cyber-status',err:err.message},'*'); }
});

/* ============================== 独立面板 ============================== */
$('pPart').addEventListener('input',function(){ applyCfg({part:this.value}); restart(); });
$('pTitle').addEventListener('input',function(){ applyCfg({title:this.value}); restart(); });
$('pSub').addEventListener('input',function(){ applyCfg({sub:this.value}); restart(); });
$('pPlay').addEventListener('click',function(){ restart(); });
$('pImg').addEventListener('change',function(){
  var f=this.files&&this.files[0]; if(!f) return;
  if(!/^image\//i.test(f.type||'')) return;
  var r=new FileReader();
  r.onload=function(){ setProdImg(r.result); applyCfg({}); restart(); };
  r.readAsDataURL(f); this.value='';
});

/* ============================== 启动 ============================== */
buildStatic();
/* ⚠️ 顺序不能反：applyCfg 只认「传了的键」，__BZ_BOOT 里带的是固化时的用户值，
   必须先铺默认再拿 boot 覆盖，否则固化 HTML 打开永远是模板默认字。 */
applyCfg(cfg);
if(window.__BZ_BOOT){ applyCfg(window.__BZ_BOOT); }
fit();
render(0);
/* ★ 必须自启主循环：漏掉的后果不是报错，是【预览永远停在第 0 帧】—— 版式全对、数值全绿，就是不动。 */
rafId=requestAnimationFrame(tick);
parent.postMessage({source:'cyber',type:'cyber-ready'},'*');
</script>
</body>
</html>
